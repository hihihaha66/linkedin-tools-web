name: Dedupe insurance note

on:
  push:
    paths:
      - '.github/workflows/dedupe-insurance-note.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update offer insurance note
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('net-cao-hon-co-that-tot-hon.html')
          s=p.read_text(encoding='utf-8')

          repeated='<p style="font-size:12px;color:var(--ink-soft);margin:2px 0 0;line-height:1.45;">Chưa biết mức khai bảo hiểm? Hỏi HR: “Mức lương làm căn cứ đóng BHXH/BHTN của vị trí này là bao nhiêu?” Bỏ trống phần nào chưa rõ - tool tính với phần đã có.</p>'
          s=s.replace(repeated,'')

          anchor='  <div class="offers-in" id="offersIn"></div>\n\n  <div id="empty" class="empty">Nhập gross cho ít nhất một offer để bắt đầu.</div>'
          replacement='  <div class="offers-in" id="offersIn"></div>\n\n  <p class="hint" style="max-width:none; margin:10px 0 14px;"><b>Chưa biết mức đóng bảo hiểm?</b> Có thể hỏi HR: “Mức lương làm căn cứ đóng BHXH/BHYT/BHTN của vị trí này là bao nhiêu?”. Phần nào chưa rõ cứ để trống.</p>\n\n  <div id="empty" class="empty">Nhập gross cho ít nhất một offer để bắt đầu.</div>'
          if anchor not in s:
              raise SystemExit('anchor not found')
          s=s.replace(anchor,replacement,1)

          p.write_text(s,encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/dedupe-insurance-note.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add net-cao-hon-co-that-tot-hon.html .github/workflows/dedupe-insurance-note.yml
          git commit -m "Dedupe insurance guidance across offers"
          git push origin main
