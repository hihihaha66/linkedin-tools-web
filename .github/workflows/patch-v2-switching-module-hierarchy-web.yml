name: Patch V2 switching module hierarchy web

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/patch-v2-switching-module-hierarchy-web.py'
      - '.github/workflows/patch-v2-switching-module-hierarchy-web.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/v2-switching-module-hierarchy
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply hierarchy UI patch
        run: python .github/patch-v2-switching-module-hierarchy-web.py
      - name: Validate CSP, syntax and DOM hierarchy
        shell: bash
        run: |
          python scripts/check-v2-csp.py
          python - <<'PY'
          from pathlib import Path
          html=Path('net-cao-hon-co-that-tot-hon-v2.html').read_text()
          a=html.index('<script>')+len('<script>'); b=html.index('</script>',a)
          Path('/tmp/v2-inline.js').write_text(html[a:b])
          assert html.index('Lớp 5 · <b>Nếu có biến cố</b>') < html.index('class="switch-box switch-box-results"')
          assert html.index('class="switch-box switch-box-results"') < html.index('id="assumptionLayer"')
          assert html.index('id="assumptionLayer"') < html.index('id="verdict"')
          assert html.count('id="switchEnabledSeg"') == 1
          assert html.count('id="switchingResult"') == 1
          print('PASS: switching input/result are contiguous; final review sits before verdict')
          PY
          node --check /tmp/v2-inline.js
      - name: Commit hierarchy and remove bootstrap files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/patch-v2-switching-module-hierarchy-web.py .github/workflows/patch-v2-switching-module-hierarchy-web.yml
          git add net-cao-hon-co-that-tot-hon-v2.html
          git commit -m "Keep V2 switching input and result together"
          git push origin HEAD:ux/v2-switching-module-hierarchy
