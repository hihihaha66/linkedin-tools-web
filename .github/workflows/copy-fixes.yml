name: Apply copy fixes

on:
  push:
    paths:
      - '.github/workflows/copy-fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update copy and heading weights
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Landing intro
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(
              r'<p class="intro">.*?</p>',
              '<p class="intro">\n      Mình tạo những tool này từ các bài toán thực tế trong công việc và cuộc sống. Hi vọng chúng cũng sẽ hữu ích với bạn.\n    </p>',
              s,
              count=1,
              flags=re.S,
          )
          p.write_text(s, encoding='utf-8')

          # Retention-cost tool
          p = Path('tra-thap-co-that-la-re.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'h1{font-family:var(--serif); font-weight:600;': 'h1{font-family:var(--serif); font-weight:700;',
              'Mức nơi khác mời họ / giá thị trường': 'Mức nơi khác mời ứng viên / giá thị trường',
              'mức nơi khác mời họ (hoặc giá thị trường)': 'mức nơi khác mời ứng viên (hoặc giá thị trường)',
              'Ghế trống nếu người nghỉ (tháng)': 'Thời gian vị trí bỏ trống (tháng)',
              'Năng suất giai đoạn thử việc (%)': 'Dự kiến năng suất người mới giai đoạn thử việc (%)',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          # Offer-comparison tool title
          p = Path('net-cao-hon-co-that-tot-hon.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'header h1{font-family:var(--serif); font-weight:600;',
              'header h1{font-family:var(--serif); font-weight:700;'
          )
          p.write_text(s, encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/copy-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tra-thap-co-that-la-re.html net-cao-hon-co-that-tot-hon.html .github/workflows/copy-fixes.yml
          git commit -m "Refine tool copy and heading hierarchy"
          git push
