name: Remove V2 switching start date UI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/patch-v2-remove-switch-start-date-web.py'
      - '.github/workflows/patch-v2-remove-switch-start-date-web.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v2-remove-switch-start-date
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply UI fix
        run: python .github/patch-v2-remove-switch-start-date-web.py
      - name: Validate CSP, syntax and removed concept
        shell: bash
        run: |
          python scripts/check-v2-csp.py
          python - <<'PY'
          from pathlib import Path
          html=Path('net-cao-hon-co-that-tot-hon-v2.html').read_text()
          a=html.index('<script>')+len('<script>'); b=html.index('</script>',a)
          Path('/tmp/v2-inline.js').write_text(html[a:b])
          for forbidden in ['data-sw="asOfDate"','<label>Tính từ ngày</label>','payload.switching.asOfDate','localToday()']:
            assert forbidden not in html, forbidden
          assert 'Phép so bắt đầu từ ngày sau Last working day' in html
          print('PASS: start-date concept removed from V2 frontend')
          PY
          node --check /tmp/v2-inline.js
      - name: Commit fix and remove bootstrap files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/patch-v2-remove-switch-start-date-web.py .github/workflows/patch-v2-remove-switch-start-date-web.yml
          git add net-cao-hon-co-that-tot-hon-v2.html
          git commit -m "Remove V2 switching start date"
          git push origin HEAD:fix/v2-remove-switch-start-date
