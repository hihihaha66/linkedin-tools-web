name: V4 six microcopy fixes

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/patch-v4-six-microcopy-fixes.py'
      - '.github/v4-six-mobile-shots.mjs'
      - '.github/workflows/patch-v4-six-microcopy-fixes.yml'
      - 'tests/v4-six-microcopy-regression.mjs'
      - 'tests/v4-clean-ui.mjs'

permissions:
  contents: write

jobs:
  patch-test-screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v4-six-microcopy-fixes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply six V4 microcopy changes
        run: python .github/patch-v4-six-microcopy-fixes.py
      - name: Verify V3 freeze and V4-only scope
        shell: bash
        run: |
          git diff --exit-code HEAD -- net-cao-hon-co-that-tot-hon-v3.html
          grep -q 'So sánh công việc hiện tại với 1-2 offer theo tiền, thời gian, bảo hiểm và tác động khi chuyển việc - để bạn thấy mình đang đổi gì lấy gì.' net-cao-hon-co-that-tot-hon-v4.html
          grep -q 'Chưa biết mức đóng bảo hiểm?' net-cao-hon-co-that-tot-hon-v4.html
          grep -q 'Thời gian bạn bỏ ra để có mức thu nhập đó' net-cao-hon-co-that-tot-hon-v4.html
          grep -q 'Chưa mô phỏng quyết toán thuế khi đổi nơi làm việc.' net-cao-hon-co-that-tot-hon-v4.html
          grep -q '/api/offer-value-v4' net-cao-hon-co-that-tot-hon-v4.html
      - name: Verify inline JS/CSP unchanged
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,hashlib,base64
          html=Path('net-cao-hon-co-that-tot-hon-v4.html').read_text()
          start=html.index('<script>')+len('<script>');end=html.index('</script>',start);js=html[start:end]
          m=re.search(r"script-src 'sha256-([^']+)'",html);assert m
          assert m.group(1)==base64.b64encode(hashlib.sha256(js.encode()).digest()).decode()
          PY
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local server
        run: python3 -m http.server 8000 >/tmp/v4-six-http.log 2>&1 &
      - name: Run frozen V3 regressions
        run: |
          node tests/v3-current-offers-responsive.mjs
          node tests/v3-unit-suffix-regression.mjs
      - name: Run V4 regressions
        run: |
          node tests/v4-clean-ui.mjs
          node tests/v4-six-microcopy-regression.mjs
      - name: Capture requested mobile screenshots
        run: node .github/v4-six-mobile-shots.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: v4-six-microcopy-mobile-screenshots
          path: comparison-shots/*.png
          if-no-files-found: error
      - name: Commit implementation only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/patch-v4-six-microcopy-fixes.py .github/v4-six-mobile-shots.mjs .github/workflows/patch-v4-six-microcopy-fixes.yml
          git add -- net-cao-hon-co-that-tot-hon-v4.html tests/v4-clean-ui.mjs tests/v4-six-microcopy-regression.mjs
          git commit -m "Add six V4 microcopy clarifications"
          git push origin HEAD:feature/v4-six-microcopy-fixes
