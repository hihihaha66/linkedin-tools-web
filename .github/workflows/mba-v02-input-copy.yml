name: MBA v0.2 input and copy refinement
on:
  push:
    paths:
      - '.github/workflows/mba-v02-input-copy.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Refine MBA prototype
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('mba/index.html')
          s=p.read_text(encoding='utf-8')

          reps={
          'Hiểu business của bạn bằng những con số dễ hiểu.':'Hiểu việc kinh doanh của bạn bằng những con số dễ hiểu.',
          'Từ một ý tưởng mới đến một business đang vận hành - MBA giúp bạn biết cần bán bao nhiêu để hòa vốn, đang thực sự lời bao nhiêu và một quyết định mới sẽ thay đổi điều gì.':'Từ lúc còn đang tính mở đến khi đã vận hành, MBA giúp bạn trả lời những câu hỏi quan trọng: cần bán bao nhiêu để không lỗ, tháng này lời bao nhiêu, tiền đang đi đâu và một quyết định mới sẽ ảnh hưởng thế nào.',
          'Cần bao nhiêu vốn? Bao nhiêu đơn mỗi ngày mới hòa vốn? Nếu muốn mang về một mức thu nhập nhất định thì phải bán bao nhiêu?':'Cần bao nhiêu vốn? Mỗi ngày cần bán bao nhiêu để không lỗ? Nếu muốn lời một mức nhất định mỗi tháng thì phải bán bao nhiêu?',
          'Đưa dữ liệu bán hàng hoặc sao kê vào để xem doanh thu, chi phí, lợi nhuận, tiền hiện có và điểm hòa vốn.':'Tải file bán hàng hoặc sao kê để xem doanh thu, chi phí, lợi nhuận, tiền hiện có và điểm hòa vốn.',
          'Thử tăng giá, thuê thêm người, tăng quảng cáo hoặc thay đổi chi phí trước khi thực sự quyết định.':'Thử trước tác động của việc tăng giá, thuê thêm người, tăng quảng cáo hoặc thay đổi chi phí.',
          'MBA cung cấp báo cáo quản trị và mô phỏng kinh doanh, không thay thế phần mềm kế toán hoặc báo cáo thuế.':'MBA là công cụ hỗ trợ quản trị và mô phỏng, không thay thế phần mềm kế toán hoặc báo cáo thuế.',
          'Chỉ cần vài thông tin cơ bản. MBA sẽ dùng chúng để tính điểm hòa vốn và mức bán tối thiểu.':'MBA chỉ hỏi những số cần thiết để tính điểm hòa vốn và mức bán tối thiểu.',
          'Bạn cần bao nhiêu tiền để bắt đầu?':'Bạn cần bỏ ra bao nhiêu trước khi bắt đầu bán?',
          'Trước khi bán được đơn đầu tiên, bạn dự kiến phải bỏ ra những khoản nào? Chưa biết khoản nào thì cứ để trống.':'Nhập những khoản bạn dự kiến phải chi trước khi bắt đầu bán. Số mờ trong ô chỉ là ví dụ, MBA không tính cho đến khi bạn nhập.',
          'Sửa chữa / setup':'Sửa chữa / trang trí',
          'Marketing khai trương':'Quảng cáo khai trương',
          'Bạn đang dự kiến cần khoảng':'Tổng tiền dự kiến ban đầu',
          'Mỗi tháng, kể cả bán ít, bạn vẫn phải trả gì?':'Mỗi tháng bạn vẫn phải trả những gì, dù bán nhiều hay ít?',
          'Đây là những khoản business vẫn phải gánh dù tháng đó bán được nhiều hay ít.':'Đây là những khoản thường lặp lại hàng tháng và không thay đổi nhiều theo số đơn. Số mờ chỉ là ví dụ.',
          'Mỗi tháng business cần khoảng':'Tổng các khoản phải trả mỗi tháng',
          'Một lần bán hàng để lại cho bạn bao nhiêu?':'Mỗi đơn bán được, bạn còn lại bao nhiêu?',
          'Chỉ cần nhập khách thường trả bao nhiêu và bạn phải bỏ trực tiếp bao nhiêu để tạo ra đơn đó.':'Lấy số tiền khách trả trừ những chi phí phát sinh trực tiếp cho đơn đó. Phần còn lại sẽ dùng để trả tiền thuê, lương và các chi phí hàng tháng khác, sau đó mới thành lợi nhuận.',
          'Khách trả trung bình':'Khách trả trung bình cho một đơn',
          'Để có đơn / sản phẩm / dịch vụ đó, bạn mất trực tiếp khoảng bao nhiêu?':'Chi phí trực tiếp cho một đơn',
          'Còn lại</span><b id="con"':'Còn lại sau chi phí trực tiếp</span><b id="con"',
          'Bạn nghĩ mình bán được khoảng bao nhiêu?':'Bạn dự kiến bán được khoảng bao nhiêu?',
          'Chỉ cần một mức bạn cho là hợp lý để MBA so với điểm hòa vốn.':'Nhập mức bán bạn đang kỳ vọng. MBA sẽ so con số này với mức tối thiểu để không lỗ.',
          'Bạn muốn business mang lại bao nhiêu mỗi tháng?':'Bạn muốn lời bao nhiêu mỗi tháng?',
          'Bạn đang cân điều gì?':'Bạn đang cân nhắc điều gì?',
          'MBA dùng tình hình hiện tại làm mốc rồi tính xem một thay đổi sẽ tạo thêm bao nhiêu áp lực lên business.':'MBA lấy số hiện tại làm mốc để cho bạn thấy quyết định đó làm lợi nhuận và điểm hòa vốn thay đổi thế nào.',
          'Người mới sẽ khiến business tốn thêm khoảng bao nhiêu mỗi tháng?':'Nếu thuê người này, mỗi tháng bạn dự kiến tốn thêm bao nhiêu?',
          "'Flow Giao dịch sẽ nối ở prototype tiếp theo.'":"'Phần giao dịch đang được hoàn thiện trong bản MVP tiếp theo.'",
          "'Flow Import sẽ được làm ở prototype tiếp theo.'":"'Phần nhập file bán hàng và sao kê đang được hoàn thiện trong bản MVP tiếp theo.'",
          "'Scenario tăng/giảm giá sẽ nối ở prototype tiếp theo.'":"'Mô phỏng tăng/giảm giá đang được hoàn thiện.'",
          "'Scenario quảng cáo sẽ nối ở prototype tiếp theo.'":"'Mô phỏng quảng cáo đang được hoàn thiện.'",
          "'Scenario chi phí cố định sẽ nối ở prototype tiếp theo.'":"'Mô phỏng thay đổi chi phí đang được hoàn thiện.'",
          "'Flow hoàn thiện dữ liệu sẽ nằm trong prototype Import.'":"'Phần hoàn thiện giao dịch sẽ đi cùng chức năng nhập dữ liệu.'",
          "+' cần bán bao nhiêu để tự nuôi được?'":"+' cần bán bao nhiêu để không lỗ?'",
          "'≈ '+orders+' đơn/ngày theo mức còn lại bình quân trên mỗi đơn hiện tại.'":"'≈ '+orders+' đơn/ngày nếu mỗi đơn vẫn còn lại khoảng 50.000đ sau chi phí trực tiếp.'"
          }
          for a,b in reps.items():
              if a not in s:
                  print('WARN missing:',a[:80])
              s=s.replace(a,b)

          input_reps={
          '<input class="startup" type="number" value="20000000">':'<input class="startup money" type="text" inputmode="numeric" placeholder="20,000,000">',
          '<input class="startup" type="number" value="30000000">':'<input class="startup money" type="text" inputmode="numeric" placeholder="30,000,000">',
          '<input class="startup" type="number" value="25000000">':'<input class="startup money" type="text" inputmode="numeric" placeholder="25,000,000">',
          '<input class="startup" type="number" value="10000000">':'<input class="startup money" type="text" inputmode="numeric" placeholder="10,000,000">',
          '<input class="startup" type="number">':'<input class="startup money" type="text" inputmode="numeric" placeholder="5,000,000">',
          '<input class="fixed" type="number" value="12000000">':'<input class="fixed money" type="text" inputmode="numeric" placeholder="12,000,000">',
          '<input class="fixed" type="number" value="18000000">':'<input class="fixed money" type="text" inputmode="numeric" placeholder="18,000,000">',
          '<input class="fixed" type="number" value="3000000">':'<input class="fixed money" type="text" inputmode="numeric" placeholder="3,000,000">',
          '<input class="fixed" type="number" value="1000000">':'<input class="fixed money" type="text" inputmode="numeric" placeholder="1,000,000">',
          '<input id="price" type="number" value="50000">':'<input id="price" class="money" type="text" inputmode="numeric" placeholder="50,000">',
          '<input id="direct" type="number" value="20000">':'<input id="direct" class="money" type="text" inputmode="numeric" placeholder="20,000">',
          '<input id="daily" type="number" value="40">':'<input id="daily" type="number" inputmode="numeric" placeholder="40">',
          '<input id="days" type="number" value="30">':'<input id="days" type="number" inputmode="numeric" placeholder="30">',
          '<input id="target" type="number" value="20000000">':'<input id="target" class="money" type="text" inputmode="numeric" placeholder="20,000,000">',
          '<input id="hireCost" type="number" value="12000000">':'<input id="hireCost" class="money" type="text" inputmode="numeric" placeholder="12,000,000">'
          }
          for a,b in input_reps.items():
              if a not in s:
                  print('WARN input missing:',a)
              s=s.replace(a,b)

          s=s.replace('input:focus,select:focus{','input::placeholder{color:#aaa59b;opacity:1}input:focus,select:focus{')

          old="const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],fmt=n=>new Intl.NumberFormat('vi-VN').format(Math.round(n)),fmtM=n=>{let m=n/1e6;return(Math.abs(m-Math.round(m))<.05?Math.round(m):m.toFixed(1).replace('.',','))+' triệu'};let plan={};"
          new="const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],fmt=n=>new Intl.NumberFormat('vi-VN').format(Math.round(n)),fmtM=n=>{let m=n/1e6;return(Math.abs(m-Math.round(m))<.05?Math.round(m):m.toFixed(1).replace('.',','))+' triệu'},num=v=>Number(String(v??'').replace(/[^0-9.-]/g,''))||0;let plan={};$$('.money').forEach(el=>el.addEventListener('input',e=>{const d=e.target.value.replace(/\\D/g,'');e.target.value=d?Number(d).toLocaleString('en-US'):'';}));"
          if old not in s: print('WARN js header not found')
          s=s.replace(old,new)

          s=s.replace("function st(){let n=$$('.startup').reduce((s,x)=>s+(+x.value||0),0);$('#startupTotal').textContent=fmtM(n);return n}","function st(){let els=$$('.startup'),has=els.some(x=>x.value.trim()!==''),n=els.reduce((s,x)=>s+num(x.value),0);$('#startupTotal').textContent=has?fmtM(n):'Chưa nhập';return n}")
          s=s.replace("function ft(){let n=$$('.fixed').reduce((s,x)=>s+(+x.value||0),0);$('#fixedTotal').textContent=fmtM(n);return n}","function ft(){let els=$$('.fixed'),has=els.some(x=>x.value.trim()!==''),n=els.reduce((s,x)=>s+num(x.value),0);$('#fixedTotal').textContent=has?fmtM(n):'Chưa nhập';return n}")
          s=s.replace("function unit(){let p=+$('#price').value||0,c=+$('#direct').value||0,z=p-c;$('#cp').textContent=fmt(p)+'đ';$('#cc').textContent='-'+fmt(c)+'đ';$('#con').textContent=fmt(z)+'đ';$('#unitNote').innerHTML=z>0?'Mỗi đơn để lại khoảng <b>'+fmt(z)+'đ</b> để trả chi phí hàng tháng và tạo lợi nhuận.':'Với số bạn vừa nhập, mỗi đơn chưa đủ bù chi phí trực tiếp.'}","function unit(){let pe=$('#price'),ce=$('#direct');if(!pe.value||!ce.value){$('#cp').textContent='-';$('#cc').textContent='-';$('#con').textContent='-';$('#unitNote').innerHTML='Nhập giá bán và chi phí trực tiếp để MBA tính phần còn lại trên mỗi đơn.';return}let p=num(pe.value),c=num(ce.value),z=p-c;$('#cp').textContent=fmt(p)+'đ';$('#cc').textContent='-'+fmt(c)+'đ';$('#con').textContent=fmt(z)+'đ';$('#unitNote').innerHTML=z>0?'Sau chi phí trực tiếp, mỗi đơn còn khoảng <b>'+fmt(z)+'đ</b> để trả các khoản hàng tháng và tạo lợi nhuận.':'Với số bạn vừa nhập, tiền khách trả chưa đủ bù chi phí trực tiếp của một đơn.'}")
          s=s.replace("function sales(){let q=(+$('#daily').value||0)*(+$('#days').value||0),r=q*(+$('#price').value||0);$('#orders').textContent=fmt(q)+' đơn/tháng';$('#rev').textContent=fmtM(r)}","function sales(){let de=$('#daily'),dy=$('#days'),pe=$('#price');if(!de.value||!dy.value||!pe.value){$('#orders').textContent='Chưa tính';$('#rev').textContent='Chưa tính';return}let q=(+de.value||0)*(+dy.value||0),r=q*num(pe.value);$('#orders').textContent=fmt(q)+' đơn/tháng';$('#rev').textContent=fmtM(r)}")
          s=s.replace("function showResult(){let startup=st(),fixed=ft(),price=+$('#price').value||0,cost=+$('#direct').value||0,con=price-cost,daily=+$('#daily').value||0,days=+$('#days').value||30,q=daily*days,rev=q*price,profit=q*con-fixed,be=con>0?Math.ceil((fixed/con)/days):0;","function showResult(){if(!$('#price').value||!$('#direct').value||!$('#daily').value||!$('#days').value){toast('Nhập giá bán, chi phí trực tiếp, số đơn dự kiến và số ngày bán trước khi xem kết quả.');return}let startup=st(),fixed=ft(),price=num($('#price').value),cost=num($('#direct').value),con=price-cost,daily=+$('#daily').value||0,days=+$('#days').value||30,q=daily*days,rev=q*price,profit=q*con-fixed,be=con>0?Math.ceil((fixed/con)/days):0;")
          s=s.replace("function target(){if(!plan.con)return;let t=+$('#target').value||0;$('#targetDaily').textContent=Math.ceil(((plan.fixed+t)/plan.con)/plan.days)+' đơn/ngày'}","function target(){if(!plan.con)return;if(!$('#target').value){$('#targetDaily').textContent='Chưa nhập';return}let t=num($('#target').value);$('#targetDaily').textContent=Math.ceil(((plan.fixed+t)/plan.con)/plan.days)+' đơn/ngày'}")
          s=s.replace("function hireCalc(){let c=+$('#hireCost').value||0,x=c/.706,","function hireCalc(){if(!$('#hireCost').value){toast('Nhập chi phí dự kiến mỗi tháng trước khi tính.');return}let c=num($('#hireCost').value),x=c/.706,")

          p.write_text(s,encoding='utf-8')
          PY
          rm .github/workflows/mba-v02-input-copy.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add mba/index.html .github/workflows/mba-v02-input-copy.yml
          git commit -m "Refine MBA inputs and Vietnamese copy"
          git push
