name: MBA headline update
on:
  push:
    paths:
      - '.github/workflows/mba-headline-update.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update MBA headline only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('mba/index.html')
          s=p.read_text(encoding='utf-8')
          old='Hiểu việc kinh doanh của bạn bằng những con số dễ hiểu.'
          new='Những con số bạn cần để biết business của mình đang ổn hay không.'
          if old not in s:
              raise SystemExit('headline not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          rm .github/workflows/mba-headline-update.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add mba/index.html .github/workflows/mba-headline-update.yml
          git commit -m "Update MBA landing headline"
          git push
