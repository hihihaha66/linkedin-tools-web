name: Update V2 probation duration unit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/patch-v2-probation-duration-unit.py'
      - '.github/workflows/patch-v2-probation-duration-unit.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v2-probation-duration-unit
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply update
        run: python .github/patch-v2-probation-duration-unit.py
      - name: Static checks
        shell: bash
        run: |
          python scripts/check-v2-csp.py
          python - <<'PY'
          from pathlib import Path
          html=Path('net-cao-hon-co-that-tot-hon-v2.html').read_text()
          required=[
            'Thời gian bạn bỏ ra để có package đó',
            "probDurationValue:null,probDurationUnit:\"months\"",
            'function probDurationMonthsForApi(o)',
            'function probDurationStatus(o)',
            "html+=row('Thời gian thử việc'",
            'Nhập theo đúng đơn vị offer hoặc hợp đồng ghi.',
            'data-k=\"probDurationUnit\"',
            "o.probMon=probDurationMonthsForApi(src)",
            '6 ngày làm việc'
          ]
          for x in required: assert x in html, x
          assert "html+=row('Số tháng thử việc'" not in html
          assert 'Giờ bạn bỏ ra để có package đó' not in html
          a=html.index('<script>')+len('<script>'); b=html.index('</script>',a)
          Path('/tmp/v2-inline.js').write_text(html[a:b])
          print('PASS static probation duration unit')
          PY
          node --check /tmp/v2-inline.js
      - name: Install DOM test dependency
        run: npm install --no-save jsdom@24
      - name: Behavioral test month/day flow and legal thresholds
        shell: bash
        run: |
          node <<'JS'
          const fs=require('fs');
          const {JSDOM}=require('jsdom');
          let html=fs.readFileSync('net-cao-hon-co-that-tot-hon-v2.html','utf8').replace(/<link[^>]+fonts\.googleapis\.com[^>]*>/g,'').replace(/<link[^>]+fonts\.gstatic\.com[^>]*>/g,'');
          const requests=[];
          const dom=new JSDOM(html,{runScripts:'dangerously',url:'https://example.test/',beforeParse(w){w.fetch=async(_url,opts)=>{requests.push(JSON.parse(opts.body));return{status:200,ok:true,json:async()=>({hasResults:false})}}}});
          const w=dom.window,d=w.document;
          const click=el=>el.dispatchEvent(new w.MouseEvent('click',{bubbles:true}));
          const input=(el,value)=>{el.value=value;el.dispatchEvent(new w.Event('input',{bubbles:true}))};
          const change=(el,value)=>{el.value=value;el.dispatchEvent(new w.Event('change',{bubbles:true}))};
          const durationInput=()=>d.querySelector('input[data-i="0"][data-k="probDurationValue"]');
          const unit=()=>d.querySelector('select[data-i="0"][data-k="probDurationUnit"]');
          const job=()=>d.querySelector('select[data-i="0"][data-k="probJobType"]');
          const help=()=>d.querySelector('[data-probdur-help="0"]');

          click(d.querySelector('[data-seg="probationEnabled"][data-i="0"] [data-v="yes"]'));
          if(!durationInput()||!unit())throw new Error('duration value/unit controls missing');
          if(unit().value!=='months')throw new Error('default unit must be months');
          if(!help().textContent.includes('cần lớn hơn 0'))throw new Error('empty duration helper missing');

          // Existing monthly behavior remains exact.
          input(durationInput(),'2');
          change(job(),'college');
          input(d.querySelector('input[data-i="0"][data-k="gross"]'),'20,000,000');
          setTimeout(()=>{
            try{
              let body=requests.at(-1);if(!body)throw new Error('no API body for month case');
              if(Math.abs(body.offers[0].probMon-2)>1e-9)throw new Error('2 months adapter mismatch '+body.offers[0].probMon);
              if('probDurationValue' in body.offers[0]||'probDurationUnit' in body.offers[0])throw new Error('frontend duration fields leaked to backend');

              // Exact day case: 60 is valid for college and normalizes to 2 months.
              change(unit(),'days');
              input(durationInput(),'60');
              if(help().style.display!=='none')throw new Error('60 days should not warn for college');
              setTimeout(()=>{
                try{
                  body=requests.at(-1);if(Math.abs(body.offers[0].probMon-2)>1e-9)throw new Error('60 days adapter mismatch '+body.offers[0].probMon);

                  // 61 days must warn immediately and stay >2 months in payload.
                  input(durationInput(),'61');
                  if(!help().textContent.includes('Bạn nhập 61 ngày')||!help().textContent.includes('60 ngày'))throw new Error('61-day exact legal warning missing');
                  setTimeout(()=>{
                    try{
                      body=requests.at(-1);if(!(body.offers[0].probMon>2))throw new Error('61 days should normalize above 2 months');

                      // Special legal case: other = 6 working days, normalized on 22 workdays/month basis.
                      change(job(),'other');
                      input(durationInput(),'6');
                      if(help().style.display!=='none')throw new Error('6 working days should be valid');
                      setTimeout(()=>{
                        try{
                          body=requests.at(-1);if(Math.abs(body.offers[0].probMon-(6/22))>1e-9)throw new Error('6 working-day adapter mismatch '+body.offers[0].probMon);
                          input(durationInput(),'7');
                          if(!help().textContent.includes('6 ngày làm việc'))throw new Error('7-day working-day warning missing');

                          // Invalid/blank helpers still work.
                          input(durationInput(),'0');
                          if(!help().textContent.includes('phải lớn hơn 0')||durationInput().getAttribute('aria-invalid')!=='true')throw new Error('zero validation missing');
                          input(durationInput(),'');
                          if(!help().textContent.includes('cần lớn hơn 0')||durationInput().hasAttribute('aria-invalid'))throw new Error('blank helper reset failed');
                          console.log('PASS month/day adapter + exact legal validation');w.close();
                        }catch(e){console.error(e);process.exitCode=1;w.close()}
                      },700);
                    }catch(e){console.error(e);process.exitCode=1;w.close()}
                  },700);
                }catch(e){console.error(e);process.exitCode=1;w.close()}
              },700);
            }catch(e){console.error(e);process.exitCode=1;w.close()}
          },700);
          JS
      - name: Behavioral test legacy state migration
        shell: bash
        run: |
          node <<'JS'
          const fs=require('fs');
          const {JSDOM}=require('jsdom');
          let html=fs.readFileSync('net-cao-hon-co-that-tot-hon-v2.html','utf8').replace(/<link[^>]+fonts\.googleapis\.com[^>]*>/g,'').replace(/<link[^>]+fonts\.gstatic\.com[^>]*>/g,'');
          const old={deps:null,region:'I',offers:[{name:'Offer A',gross:null,probationEnabled:'yes',probPct:'85',probMon:'2',probJobType:'college'},{name:'Offer B',gross:null}]};
          const dom=new JSDOM(html,{runScripts:'dangerously',url:'https://example.test/',beforeParse(w){w.localStorage.setItem('net-cao-hon-v2-state',JSON.stringify(old));w.fetch=async()=>({status:200,ok:true,json:async()=>({hasResults:false})})}});
          const d=dom.window.document,input=d.querySelector('input[data-i="0"][data-k="probDurationValue"]'),unit=d.querySelector('select[data-i="0"][data-k="probDurationUnit"]');
          if(!input||input.value!=='2'||unit.value!=='months')throw new Error('legacy probMon did not migrate to raw 2 months');
          console.log('PASS legacy probMon migration');dom.window.close();
          JS
      - name: Commit update and remove bootstrap files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/patch-v2-probation-duration-unit.py .github/workflows/patch-v2-probation-duration-unit.yml
          git add net-cao-hon-co-that-tot-hon-v2.html
          git commit -m "Support probation duration in months or days"
          git push origin HEAD:refactor/v2-probation-duration-unit
