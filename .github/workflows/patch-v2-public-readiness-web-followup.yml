name: Patch V2 public readiness web follow-up

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/patch-v2-public-readiness-web-followup.py'
      - '.github/workflows/patch-v2-public-readiness-web-followup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v2-public-readiness
      - name: Apply frontend follow-up
        run: python .github/patch-v2-public-readiness-web-followup.py
      - name: Validate release copy
        shell: bash
        run: |
          grep -F 'không phải dòng tiền 12 tháng lịch kể từ ngày onboard' net-cao-hon-co-that-tot-hon-v2.html
          grep -F 'Số thưởng đảm bảo dự kiến về tay trong năm onboard' net-cao-hon-co-that-tot-hon-v2.html
      - name: Commit follow-up and remove bootstrap files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/patch-v2-public-readiness-web-followup.py .github/workflows/patch-v2-public-readiness-web-followup.yml
          git add index.html net-cao-hon-co-that-tot-hon-v2.html
          git commit -m "Tighten V2 release copy"
          git push origin HEAD:release/v2-public-readiness
