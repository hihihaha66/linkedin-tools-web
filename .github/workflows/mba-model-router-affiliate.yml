name: MBA model router and affiliate prototype
on:
  push:
    paths:
      - '.github/workflows/mba-model-router-affiliate.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch MBA prototype
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('mba/index.html')
          s=p.read_text(encoding='utf-8')

          # Add router / MMO styles.
          css_anchor='.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}'
          css_extra=css_anchor+".modelGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.modelCard{border:1px solid var(--line);background:#fbf9f3;border-radius:11px;padding:15px;text-align:left;cursor:pointer}.modelCard:hover{border-color:var(--green)}.modelCard h3{font-size:18px;margin:0 0 5px}.modelCard p{font-size:12px;color:var(--muted);margin:0}.modelCard .tag{font-family:var(--mono);font-size:10px;color:var(--green);margin-bottom:7px}.mmoNote{font-size:12px;color:var(--muted);margin-top:12px;padding:11px 12px;background:var(--surface2);border-radius:9px}.resultRows{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:13px}.resultRows .kpi{min-height:110px}"
          if css_anchor not in s:
            raise SystemExit('css anchor not found')
          s=s.replace(css_anchor,css_extra,1)
          s=s.replace('@media(max-width:650px){.wrap{','@media(max-width:650px){.modelGrid,.resultRows{grid-template-columns:1fr}.wrap{',1)

          # Replace old planning first step with the model router and add Quán sub-step + MMO/Affiliate happy path.
          pattern=r'<section class="screen" id="p1">.*?</section>\n<section class="screen" id="p2">'
          new_block=r'''<section class="screen" id="p1"><div class="head"><div class="eyebrow">Lập kế hoạch</div><h1>Bạn dự định kiếm tiền chủ yếu theo cách nào?</h1><p>MBA sẽ hỏi khác nhau tùy cách bạn kiếm tiền, để không ép mọi mô hình vào cùng một công thức.</p></div><div class="modelGrid"><button class="modelCard" onclick="go('p1store')"><div class="tag">01</div><h3>Quán / cửa hàng</h3><p>Bán trực tiếp cho khách tại một địa điểm như quán ăn, cà phê, salon hoặc cửa hàng.</p></button><button class="modelCard" onclick="toast('Flow Bán hàng online / TMĐT đang được hoàn thiện.')"><div class="tag">02</div><h3>Bán hàng online / TMĐT</h3><p>Bán sản phẩm qua Shopee, TikTok Shop, Facebook, website hoặc các kênh online khác.</p></button><button class="modelCard" onclick="toast('Flow Dịch vụ / Freelance / Agency đang được hoàn thiện.')"><div class="tag">03</div><h3>Dịch vụ / Freelance / Agency</h3><p>Kiếm tiền từ công việc, dự án, giờ làm hoặc khách hàng định kỳ.</p></button><button class="modelCard" onclick="go('mmoType')"><div class="tag">04</div><h3>MMO / Kiếm tiền online</h3><p>Kiếm tiền từ traffic, nội dung, affiliate, quảng cáo hoặc lead.</p></button><button class="modelCard" onclick="toast('Flow Sản phẩm số / Subscription đang được hoàn thiện.')"><div class="tag">05</div><h3>Sản phẩm số / Subscription</h3><p>Bán khóa học, template, membership, phần mềm hoặc thu phí định kỳ.</p></button><button class="modelCard" onclick="toast('Flow Kết hợp nhiều nguồn thu đang được hoàn thiện.')"><div class="tag">06</div><h3>Kết hợp nhiều nguồn thu</h3><p>Một business có nhiều nguồn thu như bán tại quán + Grab hoặc creator + affiliate.</p></button><button class="modelCard" onclick="toast('Flow Khác sẽ dùng bộ câu hỏi chung ở bản tiếp theo.')"><div class="tag">07</div><h3>Khác</h3><p>Dùng khi mô hình của bạn chưa nằm trong các nhóm trên.</p></button></div><div class="actions"><button class="btn secondary" onclick="go('landing')">Quay lại</button></div></section>
<section class="screen" id="p1store"><div class="head"><div class="eyebrow">Quán / cửa hàng</div><h1>Bạn đang tính mở gì?</h1><p>MBA sẽ dùng những số này để tính mức bán tối thiểu và điểm hòa vốn.</p></div><div class="form"><div class="field"><label>Tên hoặc mô tả</label><input id="name" value="Quán 1"></div><div class="field"><label>Bạn chủ yếu bán gì?</label><div class="opts" id="types"><button class="opt a">Đồ ăn / đồ uống</button><button class="opt">Hàng hóa</button><button class="opt">Dịch vụ tại cửa hàng</button><button class="opt">Kết hợp</button></div></div><div class="actions"><button class="btn secondary" onclick="go('p1')">Quay lại</button><button class="btn" onclick="go('p2')">Tiếp tục</button></div></div></section>
<section class="screen" id="mmoType"><div class="head"><div class="eyebrow">MMO / Kiếm tiền online</div><h1>Bạn kiếm tiền online chủ yếu bằng cách nào?</h1><p>Chọn cách gần nhất với nguồn thu chính của bạn. MBA sẽ đổi bộ câu hỏi theo từng mô hình.</p></div><div class="modelGrid"><button class="modelCard" onclick="go('affiliate1')"><h3>Affiliate / Tiếp thị liên kết</h3><p>Nhận hoa hồng khi người dùng click và tạo chuyển đổi qua link của bạn.</p></button><button class="modelCard" onclick="toast('Flow Content / Creator đang được hoàn thiện.')"><h3>Content / Creator</h3><p>Kiếm tiền từ quảng cáo nền tảng, booking, tài trợ, affiliate hoặc membership.</p></button><button class="modelCard" onclick="toast('Flow Website / App quảng cáo đang được hoàn thiện.')"><h3>Website / App quảng cáo</h3><p>Kiếm tiền chủ yếu từ traffic và lượt hiển thị quảng cáo.</p></button><button class="modelCard" onclick="toast('Flow Lead generation đang được hoàn thiện.')"><h3>Lead generation</h3><p>Tạo lead đủ điều kiện rồi nhận tiền theo lead hoặc theo hợp đồng.</p></button><button class="modelCard" onclick="toast('Flow MMO khác sẽ dùng bộ câu hỏi chung ở bản tiếp theo.')"><h3>Khác</h3><p>Mô hình MMO chưa nằm trong các nhóm trên.</p></button></div><div class="mmoNote">Nếu bạn trực tiếp bán sản phẩm cho khách qua Shopee, TikTok Shop hoặc website, hãy chọn <strong>Bán hàng online / TMĐT</strong> thay vì MMO.</div><div class="actions"><button class="btn secondary" onclick="go('p1')">Quay lại</button></div></section>
<section class="screen" id="affiliate1"><div class="head"><div class="eyebrow">MMO / Affiliate</div><h1>Affiliate của bạn hiện tạo ra bao nhiêu chuyển đổi?</h1><p>Bắt đầu bằng những số dễ biết nhất. Bạn có thể bổ sung traffic và click sau để xem funnel chi tiết hơn.</p></div><div class="form"><div class="field"><label>Số chuyển đổi trung bình mỗi tháng</label><input id="affConversions" type="number" inputmode="numeric" placeholder="500"><div class="helper">Ví dụ: số đơn, đăng ký hoặc hành động được nền tảng ghi nhận để trả hoa hồng.</div></div><div class="field"><label>Hoa hồng trung bình mỗi chuyển đổi</label><div class="amount"><input id="affCommission" class="money" type="text" inputmode="numeric" placeholder="65,000"><span>đ</span></div></div><div class="actions"><button class="btn secondary" onclick="go('mmoType')">Quay lại</button><button class="btn" onclick="go('affiliate2')">Tiếp tục</button></div></div></section>
<section class="screen" id="affiliate2"><div class="head"><div class="eyebrow">MMO / Affiliate</div><h1>Mỗi tháng bạn đang chi khoảng bao nhiêu?</h1><p>Nhập những khoản trực tiếp phục vụ việc tạo traffic và chuyển đổi. Khoản nào chưa rõ cứ để trống.</p></div><div class="form"><div class="row"><span>Quảng cáo</span><div class="amount"><input id="affAds" class="money affiliateCost" type="text" inputmode="numeric" placeholder="15,000,000"><span>đ</span></div></div><div class="row"><span>Content / thuê người</span><div class="amount"><input id="affContent" class="money affiliateCost" type="text" inputmode="numeric" placeholder="5,000,000"><span>đ</span></div></div><div class="row"><span>Tool / hosting</span><div class="amount"><input id="affTools" class="money affiliateCost" type="text" inputmode="numeric" placeholder="2,000,000"><span>đ</span></div></div><div class="row"><span>Chi phí khác</span><div class="amount"><input id="affOther" class="money affiliateCost" type="text" inputmode="numeric" placeholder="1,000,000"><span>đ</span></div></div><div class="sum"><span>Tổng chi phí tháng</span><b id="affCostTotal">Chưa nhập</b></div><button class="link" style="margin-top:12px" onclick="toast('Bản tiếp theo sẽ cho nhập thêm traffic và click để tính tỷ lệ chuyển đổi.')">+ Tôi muốn nhập thêm traffic / click</button><div class="actions"><button class="btn secondary" onclick="go('affiliate1')">Quay lại</button><button class="btn" onclick="affiliateCalc()">Xem kết quả</button></div></div></section>
<section class="screen" id="affiliateResult"><div class="result"><div class="head"><div class="eyebrow">Kết quả Affiliate</div><h1>MMO này đang để lại cho bạn bao nhiêu?</h1><p>Kết quả dưới đây dựa trên lượng chuyển đổi và chi phí bạn vừa nhập.</p></div><div class="heroResult"><div>Lợi nhuận ước tính mỗi tháng</div><div class="big" id="affProfit">-</div><div id="affProfitNote">sau các chi phí đã nhập.</div></div><div class="resultRows"><div class="kpi"><label>Doanh thu hoa hồng</label><div class="v" id="affRevenue">-</div></div><div class="kpi"><label>Chi phí / chuyển đổi</label><div class="v" id="affCostPer">-</div><div class="delta">phân bổ theo lượng chuyển đổi hiện tại</div></div><div class="kpi"><label>Còn lại / chuyển đổi</label><div class="v" id="affNetPer">-</div></div><div class="kpi"><label>Mức hòa vốn</label><div class="v" id="affBE">-</div><div class="delta">chuyển đổi / tháng</div></div></div><div class="call" id="affInsight">Nhập số để MBA phân tích hiệu quả Affiliate.</div><div class="assume"><b>Giả định:</b> Hoa hồng bình quân và tổng chi phí tháng giữ nguyên khi số chuyển đổi thay đổi. Đây là mô phỏng quản trị, không phải dự báo chắc chắn.</div><div class="actions"><button class="btn secondary" onclick="go('affiliate1')">Thử số khác</button><button class="btn" onclick="go('mmoType')">Chọn mô hình MMO khác</button></div></div></section>
<section class="screen" id="p2">'''
          s2,n=re.subn(pattern,new_block,s,count=1,flags=re.S)
          if n!=1:
            raise SystemExit(f'planning section replacement failed: {n}')
          s=s2

          # Fix old step-back to point to the Quán sub-step.
          s=s.replace("onclick=\"go('p1')\">Quay lại</button><button class=\"btn\" onclick=\"go('p3')\">Tiếp tục", "onclick=\"go('p1store')\">Quay lại</button><button class=\"btn\" onclick=\"go('p3')\">Tiếp tục",1)

          # Existing option handler now lives on p1store. Make it null-safe.
          old="$('#types').onclick=e=>{if(!e.target.classList.contains('opt'))return;$$('.opt').forEach(x=>x.classList.remove('a'));e.target.classList.add('a')};"
          new="if($('#types'))$('#types').onclick=e=>{if(!e.target.classList.contains('opt'))return;$$('#types .opt').forEach(x=>x.classList.remove('a'));e.target.classList.add('a')};"
          if old not in s:
            raise SystemExit('types handler not found')
          s=s.replace(old,new,1)

          # Add affiliate calculations and cost preview.
          insertion="""function affiliateCostTotal(){let els=$$('.affiliateCost'),has=els.some(x=>x.value.trim()!==''),total=els.reduce((sum,x)=>sum+num(x.value),0);if($('#affCostTotal'))$('#affCostTotal').textContent=has?fmtM(total):'Chưa nhập';return total}$$('.affiliateCost').forEach(x=>x.addEventListener('input',affiliateCostTotal));function affiliateCalc(){let c=+($('#affConversions')?.value||0),commission=num($('#affCommission')?.value),cost=affiliateCostTotal();if(!c||!commission){toast('Nhập số chuyển đổi và hoa hồng trung bình trước khi xem kết quả.');return}let revenue=c*commission,profit=revenue-cost,costPer=cost/c,netPer=commission-costPer,be=commission>0?Math.ceil(cost/commission):0;$('#affRevenue').textContent=fmtM(revenue);$('#affProfit').textContent=(profit<0?'- ':'')+fmtM(Math.abs(profit));$('#affCostPer').textContent=fmt(costPer)+'đ';$('#affNetPer').textContent=(netPer<0?'- ':'')+fmt(Math.abs(netPer))+'đ';$('#affBE').textContent=fmt(be);if(netPer>0){$('#affInsight').innerHTML='Mỗi chuyển đổi mang về khoảng <b>'+fmt(commission)+'đ</b>. Sau khi phân bổ các chi phí tháng theo lượng chuyển đổi hiện tại, bạn còn khoảng <b>'+fmt(netPer)+'đ/chuyển đổi</b>.'}else{$('#affInsight').innerHTML='Ở mức hiện tại, chi phí phân bổ cho một chuyển đổi đang cao hơn hoa hồng nhận được khoảng <b>'+fmt(Math.abs(netPer))+'đ</b>.'}go('affiliateResult')}"""
          end_anchor='st();ft();unit();sales();'
          if end_anchor not in s:
            raise SystemExit('script end anchor not found')
          s=s.replace(end_anchor,insertion+end_anchor,1)

          p.write_text(s,encoding='utf-8')
          PY
          rm .github/workflows/mba-model-router-affiliate.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add mba/index.html .github/workflows/mba-model-router-affiliate.yml
          git commit -m "Add MBA model router and affiliate planning flow"
          git push
