name: MBA personalization and ecommerce planning
on:
  push:
    paths:
      - '.github/workflows/mba-personalize-ecommerce.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch MBA prototype
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('mba/index.html')
          s=p.read_text(encoding='utf-8')

          # 1) Personalization: collect business name once at the model router.
          s=s.replace('<button class="biz" id="biz">Quán 1 ▾</button>','<button class="biz" id="biz" onclick="go(\'modelRouter\')">Business ▾</button>')
          s=s.replace('<h3>Tôi đang cân một quyết định</h3>','<h3>Tôi đang cân nhắc một quyết định</h3>')

          router_intro='<section class="screen" id="modelRouter"><div class="head"><div class="eyebrow">Lập kế hoạch</div><h1>Bạn dự định kiếm tiền chủ yếu theo cách nào?</h1><p>MBA sẽ hỏi khác nhau tùy cách bạn kiếm tiền, để không ép mọi mô hình vào cùng một công thức.</p></div><div class="modelGrid">'
          router_new='<section class="screen" id="modelRouter"><div class="head"><div class="eyebrow">Lập kế hoạch</div><h1>Bạn dự định kiếm tiền chủ yếu theo cách nào?</h1><p>MBA sẽ hỏi khác nhau tùy cách bạn kiếm tiền, để không ép mọi mô hình vào cùng một công thức.</p></div><div class="form" style="max-width:860px;margin-bottom:12px"><div class="field" style="margin-bottom:0"><label>Tên business / dự án</label><input id="businessName" type="text" placeholder="Ví dụ: Tiệm Mây"><div class="helper">MBA sẽ dùng tên này ở kết quả, dashboard và các kịch bản của bạn.</div></div></div><div class="modelGrid">'
          if router_intro not in s: raise SystemExit('router intro not found')
          s=s.replace(router_intro,router_new,1)
          s=s.replace("onclick=\"go('storeBasics')\"","onclick=\"chooseModel('storeBasics')\"",1)
          s=s.replace("onclick=\"toast('Flow Bán hàng online / TMĐT đang được hoàn thiện.')\"","onclick=\"chooseModel('onlineChannel')\"",1)
          s=s.replace("onclick=\"go('mmoType')\"","onclick=\"chooseModel('mmoType')\"",1)

          # Remove duplicated default name field from the Quán flow.
          old_store='<section class="screen" id="storeBasics"><div class="head"><div class="eyebrow">Quán / cửa hàng</div><h1>Bạn đang tính mở gì?</h1><p>MBA sẽ dùng những số này để tính mức bán tối thiểu và điểm hòa vốn.</p></div><div class="form"><div class="field"><label>Tên hoặc mô tả</label><input id="name" value="Quán 1"></div><div class="field"><label>Bạn chủ yếu bán gì?</label>'
          new_store='<section class="screen" id="storeBasics"><div class="head"><div class="eyebrow">Quán / cửa hàng</div><h1><span class="businessNameText">Business của tôi</span> chủ yếu bán gì?</h1><p>MBA sẽ dùng những số này để tính mức bán tối thiểu và điểm hòa vốn.</p></div><div class="form"><div class="field"><label>Bạn chủ yếu bán gì?</label>'
          if old_store not in s: raise SystemExit('store section not found')
          s=s.replace(old_store,new_store,1)

          # Personalize existing result/dashboard/decision copy.
          s=s.replace('<h1 id="resTitle">Quán 1 cần bán bao nhiêu để không lỗ?</h1>','<h1 id="resTitle">Business của tôi cần bán bao nhiêu để không lỗ?</h1>')
          s=s.replace('<button class="btn" onclick="saveBiz()">Lưu Quán 1</button>','<button class="btn" onclick="saveBiz()">Lưu kế hoạch</button>')
          s=s.replace('<h1>Quán 1</h1><p>Dữ liệu mẫu prototype - Tháng 8/2026</p>','<h1 id="dashboardName">Business của tôi</h1><p>Dữ liệu mẫu prototype - Tháng 8/2026</p>',1)
          s=s.replace('MBA đang dùng tình hình tháng 8 của Quán 1 làm mốc.','MBA đang dùng tình hình tháng 8 của <span id="hireBusinessName">business này</span> làm mốc.')

          # 3) Build Bán hàng online / TMĐT planning flow.
          online_html=r'''
<section class="screen" id="onlineChannel"><div class="head"><div class="eyebrow">Bán hàng online / TMĐT</div><h1><span class="businessNameText">Business của tôi</span> đang bán chủ yếu ở đâu?</h1><p>Chọn một hoặc nhiều kênh. Kênh bán giúp MBA hiểu các loại phí thường gặp, nhưng bạn vẫn có thể nhập số theo thực tế của mình.</p></div><div class="form"><div class="field"><label>Kênh bán</label><div class="opts" id="onlineChannels"><button class="opt" onclick="this.classList.toggle('a')">Shopee</button><button class="opt" onclick="this.classList.toggle('a')">TikTok Shop</button><button class="opt" onclick="this.classList.toggle('a')">Facebook / Instagram</button><button class="opt" onclick="this.classList.toggle('a')">Website</button><button class="opt" onclick="this.classList.toggle('a')">Khác</button></div></div><div class="actions"><button class="btn secondary" onclick="go('modelRouter')">Quay lại</button><button class="btn" onclick="go('onlineUnit')">Tiếp tục</button></div></div></section>
<section class="screen" id="onlineUnit"><div class="head"><div class="eyebrow">Bán hàng online / TMĐT</div><h1>Một đơn thành công còn lại bao nhiêu trước chi phí hàng tháng?</h1><p>MBA tách chi phí theo từng đơn khỏi quảng cáo, nhân sự và các khoản phải trả hàng tháng để bạn thấy một đơn hàng thực sự đóng góp được bao nhiêu.</p></div><div class="form"><div class="field"><label>Khách trả trung bình cho một đơn thành công</label><div class="amount"><input id="onlineAov" class="money" inputmode="numeric" placeholder="250,000"><span>đ</span></div></div><div class="row"><span>Giá nhập / chi phí sản xuất</span><div class="amount"><input id="onlineProductCost" class="money onlinePerOrder" inputmode="numeric" placeholder="120,000"><span>đ</span></div></div><div class="row"><span>Đóng gói</span><div class="amount"><input id="onlinePackaging" class="money onlinePerOrder" inputmode="numeric" placeholder="8,000"><span>đ</span></div></div><div class="row"><span>Phần vận chuyển bạn hỗ trợ</span><div class="amount"><input id="onlineShipping" class="money onlinePerOrder" inputmode="numeric" placeholder="12,000"><span>đ</span></div></div><div class="field" style="margin-top:14px"><label>Phí sàn + thanh toán (% trên doanh thu đơn thành công)</label><div class="amount"><input id="onlineFeeRate" type="number" inputmode="decimal" placeholder="10"><span>%</span></div><div class="helper">Nếu không bán qua sàn hoặc chưa rõ, có thể để trống.</div></div><div class="calc"><div><span>Khách trả</span><b id="onlinePreviewAov">-</b></div><div><span>Chi phí theo đơn</span><b id="onlinePreviewDirect">-</b></div><div><span>Phí sàn / thanh toán</span><b id="onlinePreviewFee">-</b></div><div class="total"><span>Còn lại trước chi phí tháng</span><b id="onlinePreviewContribution">-</b></div></div><div class="actions"><button class="btn secondary" onclick="go('onlineChannel')">Quay lại</button><button class="btn" onclick="go('onlineVolume')">Tiếp tục</button></div></div></section>
<section class="screen" id="onlineVolume"><div class="head"><div class="eyebrow">Bán hàng online / TMĐT</div><h1>Một tháng bạn có khoảng bao nhiêu đơn?</h1><p>Đơn hoàn hoặc hủy không trở thành doanh thu, nên MBA cần tách chúng khỏi số đơn đặt ban đầu.</p></div><div class="form"><div class="field"><label>Số đơn được đặt trung bình mỗi tháng</label><input id="onlineOrders" type="number" inputmode="numeric" placeholder="500"></div><div class="field"><label>Tỷ lệ đơn hoàn / hủy</label><div class="amount"><input id="onlineReturnRate" type="number" inputmode="decimal" placeholder="8"><span>%</span></div><div class="helper">Nếu gần như không có hoàn/hủy, nhập 0.</div></div><div class="calc"><div><span>Đơn thành công ước tính</span><b id="onlineSuccessfulOrders">Chưa tính</b></div><div class="total"><span>Giá trị đơn hoàn/hủy không thành doanh thu</span><b id="onlineReturnedValue">Chưa tính</b></div></div><div class="actions"><button class="btn secondary" onclick="go('onlineUnit')">Quay lại</button><button class="btn" onclick="go('onlineMonthly')">Tiếp tục</button></div></div></section>
<section class="screen" id="onlineMonthly"><div class="head"><div class="eyebrow">Bán hàng online / TMĐT</div><h1>Mỗi tháng bạn còn phải chi những gì?</h1><p>Đây là các khoản không gắn trực tiếp với từng đơn thành công hoặc thường được quyết định theo ngân sách tháng.</p></div><div class="form"><div class="row"><span>Quảng cáo</span><div class="amount"><input class="money onlineMonthlyCost" inputmode="numeric" placeholder="15,000,000"><span>đ</span></div></div><div class="row"><span>Nhân sự / kho / vận hành</span><div class="amount"><input class="money onlineMonthlyCost" inputmode="numeric" placeholder="10,000,000"><span>đ</span></div></div><div class="row"><span>Phần mềm / công cụ</span><div class="amount"><input class="money onlineMonthlyCost" inputmode="numeric" placeholder="2,000,000"><span>đ</span></div></div><div class="row"><span>Chi phí khác</span><div class="amount"><input class="money onlineMonthlyCost" inputmode="numeric" placeholder="3,000,000"><span>đ</span></div></div><div class="sum"><span>Tổng chi phí tháng</span><b id="onlineMonthlyTotal">Chưa nhập</b></div><div class="actions"><button class="btn secondary" onclick="go('onlineVolume')">Quay lại</button><button class="btn" onclick="onlineCalc()">Xem kết quả</button></div></div></section>
<section class="screen" id="onlineResult"><div class="result"><div class="head"><div class="eyebrow">Kết quả Bán hàng online / TMĐT</div><h1><span class="businessNameText">Business của tôi</span> đang lời bao nhiêu theo mức bán này?</h1><p>Kết quả đã tính cả tỷ lệ hoàn/hủy, chi phí trực tiếp theo đơn, phí sàn/thanh toán và các chi phí tháng bạn đã nhập.</p></div><div class="heroResult"><div>Lợi nhuận ước tính mỗi tháng</div><div class="big" id="onlineProfit">-</div><div>sau các chi phí đã nhập.</div></div><div class="resultRows"><div class="kpi"><label>Doanh thu sau hoàn/hủy</label><div class="v" id="onlineRevenue">-</div></div><div class="kpi"><label>Đơn thành công</label><div class="v" id="onlineSuccessResult">-</div><div class="delta">đơn / tháng</div></div><div class="kpi"><label>Còn lại / đơn thành công</label><div class="v" id="onlineContributionResult">-</div><div class="delta">trước chi phí tháng</div></div><div class="kpi"><label>Đơn đặt cần để hòa vốn</label><div class="v" id="onlineBEOrders">-</div><div class="delta">đơn / tháng, đã tính tỷ lệ hoàn/hủy</div></div></div><div class="call" id="onlineInsight">Nhập số để MBA phân tích.</div><div class="assume"><b>Giả định:</b> Giá trị đơn, chi phí theo đơn, tỷ lệ hoàn/hủy và tỷ lệ phí giữ nguyên khi số đơn thay đổi. Quảng cáo được coi là ngân sách tháng trong mô phỏng này.</div><div class="actions"><button class="btn secondary" onclick="go('onlineUnit')">Thử số khác</button><button class="btn" onclick="go('modelRouter')">Chọn mô hình khác</button></div></div></section>
'''
          marker='<section class="screen" id="mmoType">'
          if marker not in s: raise SystemExit('mmo marker not found')
          s=s.replace(marker,online_html+'\n'+marker,1)

          # JS: central business name + personalization.
          s=s.replace('let plan={},lastHireScenario=null;','let plan={},lastHireScenario=null,currentBusinessName=localStorage.getItem(\'mba_business_name_v02\')||\'\';')
          old_go="function go(id){$$('.screen').forEach(x=>x.classList.remove('on'));$('#'+id).classList.add('on');if(id==='decision')renderSavedScenarios();window.scrollTo(0,0)}"
          new_go="function go(id){$$('.screen').forEach(x=>x.classList.remove('on'));$('#'+id).classList.add('on');if(id==='decision')renderSavedScenarios();updateBusinessNameUI();window.scrollTo(0,0)}function chooseModel(id){const input=$('#businessName');const name=(input?.value||currentBusinessName).trim();if(!name){toast('Nhập tên business / dự án để MBA cá nhân hóa kết quả cho bạn.');if(input)input.focus();return}currentBusinessName=name;localStorage.setItem('mba_business_name_v02',name);updateBusinessNameUI();go(id)}function updateBusinessNameUI(){const name=currentBusinessName||'Business của tôi';if($('#businessName')&&currentBusinessName&&!$('#businessName').value)$('#businessName').value=currentBusinessName;$$('.businessNameText').forEach(x=>x.textContent=name);if($('#dashboardName'))$('#dashboardName').textContent=name;if($('#hireBusinessName'))$('#hireBusinessName').textContent=name;if($('#biz')){$('#biz').textContent=name+' ▾';$('#biz').style.visibility=currentBusinessName?'visible':'hidden'}}"
          if old_go not in s: raise SystemExit('go function not found')
          s=s.replace(old_go,new_go,1)
          s=s.replace("$('#resTitle').textContent=($('#name').value||'Business của tôi')+' cần bán bao nhiêu để không lỗ?';","$('#resTitle').textContent=(currentBusinessName||'Business của tôi')+' cần bán bao nhiêu để không lỗ?';")
          s=s.replace("function saveBiz(){$('#biz').style.visibility='visible';toast('Đã lưu Quán 1 trong prototype.');setTimeout(()=>go('dashboard'),350)}","function saveBiz(){updateBusinessNameUI();toast('Đã lưu kế hoạch của '+(currentBusinessName||'business này')+'.');setTimeout(()=>go('dashboard'),350)}")
          s=s.replace("lastHireScenario={id:Date.now(),title:'Thuê thêm người'","lastHireScenario={id:Date.now(),businessName:currentBusinessName||'Business của tôi',title:'Thuê thêm người'")

          # Online calculations.
          online_js="""function onlinePreview(){const aov=num($('#onlineAov')?.value),product=num($('#onlineProductCost')?.value),pack=num($('#onlinePackaging')?.value),ship=num($('#onlineShipping')?.value),feeRate=Number($('#onlineFeeRate')?.value||0),direct=product+pack+ship,fee=aov*feeRate/100,contribution=aov-direct-fee;if($('#onlinePreviewAov'))$('#onlinePreviewAov').textContent=aov?fmt(aov)+'đ':'-';if($('#onlinePreviewDirect'))$('#onlinePreviewDirect').textContent=(product||pack||ship)?'-'+fmt(direct)+'đ':'-';if($('#onlinePreviewFee'))$('#onlinePreviewFee').textContent=aov?'-'+fmt(fee)+'đ':'-';if($('#onlinePreviewContribution'))$('#onlinePreviewContribution').textContent=aov?fmt(contribution)+'đ':'-';return{aov,product,pack,ship,feeRate,direct,fee,contribution}}['onlineAov','onlineProductCost','onlinePackaging','onlineShipping','onlineFeeRate'].forEach(id=>{const e=$('#'+id);if(e)e.addEventListener('input',onlinePreview)});function onlineVolumePreview(){const orders=Number($('#onlineOrders')?.value||0),rate=Math.min(100,Math.max(0,Number($('#onlineReturnRate')?.value||0))),aov=num($('#onlineAov')?.value);if(!orders){if($('#onlineSuccessfulOrders'))$('#onlineSuccessfulOrders').textContent='Chưa tính';if($('#onlineReturnedValue'))$('#onlineReturnedValue').textContent='Chưa tính';return}const success=orders*(1-rate/100),returned=orders-success;if($('#onlineSuccessfulOrders'))$('#onlineSuccessfulOrders').textContent=fmt(success)+' đơn';if($('#onlineReturnedValue'))$('#onlineReturnedValue').textContent=aov?fmtM(returned*aov):fmt(returned)+' đơn'}['onlineOrders','onlineReturnRate'].forEach(id=>{const e=$('#'+id);if(e)e.addEventListener('input',onlineVolumePreview)});function onlineMonthlyTotal(){const els=$$('.onlineMonthlyCost'),has=els.some(x=>x.value.trim()),total=els.reduce((sum,x)=>sum+num(x.value),0);if($('#onlineMonthlyTotal'))$('#onlineMonthlyTotal').textContent=has?fmtM(total):'Chưa nhập';return total}$$('.onlineMonthlyCost').forEach(x=>x.addEventListener('input',onlineMonthlyTotal));function onlineCalc(){const u=onlinePreview(),orders=Number($('#onlineOrders')?.value||0),rate=Math.min(100,Math.max(0,Number($('#onlineReturnRate')?.value||0))),successRate=1-rate/100,fixed=onlineMonthlyTotal();if(!u.aov||!orders){toast('Nhập giá trị đơn trung bình và số đơn mỗi tháng trước khi xem kết quả.');return}if(u.contribution<=0){toast('Một đơn thành công hiện chưa đủ bù các chi phí trực tiếp. Hãy kiểm tra lại giá bán và chi phí.');return}const successful=orders*successRate,revenue=successful*u.aov,monthlyContribution=successful*u.contribution,profit=monthlyContribution-fixed,bePlaced=successRate>0?Math.ceil(fixed/(u.contribution*successRate)):0,returned=orders-successful,returnedValue=returned*u.aov;$('#onlineProfit').textContent=(profit<0?'- ':'')+fmtM(Math.abs(profit));$('#onlineRevenue').textContent=fmtM(revenue);$('#onlineSuccessResult').textContent=fmt(successful);$('#onlineContributionResult').textContent=fmt(u.contribution)+'đ';$('#onlineBEOrders').textContent=bePlaced?fmt(bePlaced):'-';let msg='Mỗi đơn thành công đang để lại khoảng <b>'+fmt(u.contribution)+'đ</b> trước chi phí tháng.';if(rate>0)msg+=' Với tỷ lệ hoàn/hủy '+rate+'%, khoảng <b>'+fmt(returned)+' đơn</b> mỗi tháng không trở thành doanh thu, tương đương khoảng <b>'+fmtM(returnedValue)+'</b> giá trị đơn.';if(profit<0)msg+=' Ở mức bán hiện tại, bạn còn thiếu khoảng <b>'+fmtM(Math.abs(profit))+'</b> để hòa vốn.';else msg+=' Sau các chi phí tháng đã nhập, lợi nhuận ước tính còn khoảng <b>'+fmtM(profit)+'</b>.';$('#onlineInsight').innerHTML=msg;go('onlineResult')}"""
          end_anchor='startupTotal();fixedTotal();unitCalc();salesCalc();affiliateCostTotal();renderSavedScenarios();'
          if end_anchor not in s: raise SystemExit('script end not found')
          s=s.replace(end_anchor,online_js+end_anchor+'updateBusinessNameUI();onlinePreview();onlineVolumePreview();onlineMonthlyTotal();',1)

          # Ensure money formatter also binds to newly inserted inputs (they exist at load).
          p.write_text(s,encoding='utf-8')
          PY
          rm .github/workflows/mba-personalize-ecommerce.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add mba/index.html .github/workflows/mba-personalize-ecommerce.yml
          git commit -m "Personalize MBA and add ecommerce planning flow"
          git push
