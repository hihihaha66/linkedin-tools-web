name: Switch V4 to isolated API endpoint

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/patch-v4-api-endpoint.py'
      - '.github/workflows/patch-v4-api-endpoint.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v4-api-endpoint
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply V4 endpoint patch
        run: python .github/patch-v4-api-endpoint.py
      - name: Verify V3 freeze and V4 endpoint isolation
        shell: bash
        run: |
          git diff --exit-code HEAD -- net-cao-hon-co-that-tot-hon-v3.html
          grep -q '/api/offer-value-v4' net-cao-hon-co-that-tot-hon-v4.html
          ! grep -q '/api/offer-value-v3' net-cao-hon-co-that-tot-hon-v4.html
      - name: Verify V4 syntax/CSP
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,hashlib,base64
          html=Path('net-cao-hon-co-that-tot-hon-v4.html').read_text();start=html.index('<script>')+len('<script>');end=html.index('</script>',start);js=html[start:end]
          Path('/tmp/v4-inline.js').write_text(js)
          m=re.search(r"script-src 'sha256-([^']+)'",html);assert m
          assert m.group(1)==base64.b64encode(hashlib.sha256(js.encode()).digest()).decode()
          PY
          node --check /tmp/v4-inline.js
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: python3 -m http.server 8000 >/tmp/v4-api-http.log 2>&1 &
      - name: Run frozen V3 regressions
        run: |
          node tests/v3-current-offers-responsive.mjs
          node tests/v3-unit-suffix-regression.mjs
      - name: Run V4 clean UI/endpoint regression
        run: node tests/v4-clean-ui.mjs
      - name: Commit implementation and remove bootstrap files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/patch-v4-api-endpoint.py .github/workflows/patch-v4-api-endpoint.yml
          git add -- net-cao-hon-co-that-tot-hon-v4.html tests/v4-clean-ui.mjs
          git commit -m "Switch V4 to isolated API endpoint"
          git push origin HEAD:fix/v4-api-endpoint
