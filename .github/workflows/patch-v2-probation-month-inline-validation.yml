name: Patch V2 probation month inline validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/patch-v2-probation-month-inline-validation.py'
      - '.github/workflows/patch-v2-probation-month-inline-validation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v2-probation-month-inline-validation
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply inline validation patch
        run: python .github/patch-v2-probation-month-inline-validation.py
      - name: Validate CSP and syntax
        shell: bash
        run: |
          python scripts/check-v2-csp.py
          python - <<'PY'
          from pathlib import Path
          html=Path('net-cao-hon-co-that-tot-hon-v2.html').read_text()
          assert 'Số tháng thử việc phải lớn hơn 0.' in html
          assert 'Khi chọn Có, số tháng thử việc cần lớn hơn 0.' in html
          assert 'aria-invalid' in html
          a=html.index('<script>')+len('<script>'); b=html.index('</script>',a)
          Path('/tmp/v2-inline.js').write_text(html[a:b])
          print('PASS: probation month inline validation present')
          PY
          node --check /tmp/v2-inline.js
      - name: Commit fix and remove bootstrap files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/patch-v2-probation-month-inline-validation.py .github/workflows/patch-v2-probation-month-inline-validation.yml
          git add net-cao-hon-co-that-tot-hon-v2.html
          git commit -m "Add V2 probation month inline validation"
          git push origin HEAD:fix/v2-probation-month-inline-validation
