name: Polish V2 offer A/B matrix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/patch-v2-offer-ab-matrix-polish.py'
      - '.github/workflows/patch-v2-offer-ab-matrix-polish.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v2-offer-ab-matrix
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply matrix polish
        run: python .github/patch-v2-offer-ab-matrix-polish.py
      - name: Validate behavior and syntax
        shell: bash
        run: |
          python scripts/check-v2-csp.py
          python - <<'PY'
          from pathlib import Path
          html=Path('net-cao-hon-co-that-tot-hon-v2.html').read_text()
          assert 'benefitsWasOpen' in html
          assert 'head(true)' in html and 'head(false)' in html
          assert 'offer-head-name' in html
          a=html.index('<script>')+len('<script>'); b=html.index('</script>',a)
          Path('/tmp/v2-inline.js').write_text(html[a:b])
          print('PASS: benefits state preserved and duplicate offer-name editors removed')
          PY
          node --check /tmp/v2-inline.js
      - name: Commit polish and remove bootstrap files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/patch-v2-offer-ab-matrix-polish.py .github/workflows/patch-v2-offer-ab-matrix-polish.yml
          git add net-cao-hon-co-that-tot-hon-v2.html
          git commit -m "Polish V2 offer matrix behavior"
          git push origin HEAD:refactor/v2-offer-ab-matrix
