name: Patch V2 zero semantics

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/patch-v2-zero-semantics.py'
      - '.github/workflows/patch-v2-zero-semantics.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v2-free-security-hardening
      - name: Apply zero-semantics fix
        run: python .github/patch-v2-zero-semantics.py
      - name: Validate CSP and zero semantics
        run: |
          python scripts/check-v2-csp.py
          grep -F 'oldTrial=src.probationEnabled==null&&(hasPositiveValue(src.probPct)||hasPositiveValue(src.probMon)' net-cao-hon-co-that-tot-hon-v2.html
      - name: Commit fix and remove bootstrap files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/patch-v2-zero-semantics.py .github/workflows/patch-v2-zero-semantics.yml
          git add net-cao-hon-co-that-tot-hon-v2.html
          git commit -m "Fix V2 zero-value legacy semantics"
          git push origin HEAD:release/v2-free-security-hardening
