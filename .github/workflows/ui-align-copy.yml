name: UI alignment copy fix

on:
  push:
    paths:
      - '.github/workflows/ui-align-copy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update landing copy and align paired fields
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace(
            'Mình tạo những tool này từ các bài toán thực tế trong công việc và cuộc sống. Hi vọng chúng cũng sẽ hữu ích với bạn.',
            'Mình tạo những tool này từ các bài toán thực tế trong công việc và cuộc sống.<br>Hi vọng chúng cũng sẽ hữu ích với bạn.'
          )
          p.write_text(s,encoding='utf-8')

          p=Path('tra-thap-co-that-la-re.html')
          s=p.read_text(encoding='utf-8')
          old='.duo{display:flex; gap:10px;} .duo .field{flex:1; min-width:0;}'
          new='.duo{display:flex; gap:10px; align-items:flex-end;} .duo .field{flex:1; min-width:0; display:flex; flex-direction:column;} .duo .field > label{min-height:42px; display:flex; align-items:flex-end; margin-bottom:5px;} .duo .field > input{height:44px; min-height:44px;}'
          if old not in s:
              raise SystemExit('Expected duo CSS block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Remove workflow and commit
        run: |
          rm .github/workflows/ui-align-copy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tra-thap-co-that-la-re.html .github/workflows/ui-align-copy.yml
          git commit -m "Align paired fields and wrap landing intro"
          git push origin main
