name: Patch V2 switching target wording

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/patch-v2-switch-target-wording.py'
      - '.github/workflows/patch-v2-switch-target-wording.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copy/v2-switch-target-wording
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply wording
        run: python .github/patch-v2-switch-target-wording.py
      - name: Validate CSP and syntax
        shell: bash
        run: |
          python scripts/check-v2-csp.py
          python - <<'PY'
          from pathlib import Path
          html=Path('net-cao-hon-co-that-tot-hon-v2.html').read_text()
          assert 'Bạn muốn so phương án ở lại với offer nào?' in html
          assert '<label>Chuyển sang offer</label>' not in html
          a=html.index('<script>')+len('<script>'); b=html.index('</script>',a)
          Path('/tmp/v2-inline.js').write_text(html[a:b])
          PY
          node --check /tmp/v2-inline.js
      - name: Commit wording and remove bootstrap files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/patch-v2-switch-target-wording.py .github/workflows/patch-v2-switch-target-wording.yml
          git add net-cao-hon-co-that-tot-hon-v2.html
          git commit -m "Clarify V2 switching offer question"
          git push origin HEAD:copy/v2-switch-target-wording
