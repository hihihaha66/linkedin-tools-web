name: Patch V2 historical switching dates web

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/patch-v2-historical-switching-dates-web.py'
      - '.github/workflows/patch-v2-historical-switching-dates-web.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v2-historical-switching-dates
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply historical date UI fix
        run: python .github/patch-v2-historical-switching-dates-web.py
      - name: Validate CSP and syntax
        shell: bash
        run: |
          python scripts/check-v2-csp.py
          python - <<'PY'
          from pathlib import Path
          html=Path('net-cao-hon-co-that-tot-hon-v2.html').read_text()
          a=html.index('<script>')+len('<script>'); b=html.index('</script>',a)
          Path('/tmp/v2-inline.js').write_text(html[a:b])
          PY
          node --check /tmp/v2-inline.js
          grep -F 'Tính từ ngày' net-cao-hon-co-that-tot-hon-v2.html
          grep -F '&& !payload.switching.asOfDate' net-cao-hon-co-that-tot-hon-v2.html || grep -F '&&!payload.switching.asOfDate' net-cao-hon-co-that-tot-hon-v2.html
      - name: Commit fix and remove bootstrap files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/patch-v2-historical-switching-dates-web.py .github/workflows/patch-v2-historical-switching-dates-web.yml
          git add net-cao-hon-co-that-tot-hon-v2.html
          git commit -m "Allow historical V2 switching dates"
          git push origin HEAD:fix/v2-historical-switching-dates
