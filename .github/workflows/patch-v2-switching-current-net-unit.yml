name: Fix V2 switching current net unit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/patch-v2-switching-current-net-unit.py'
      - '.github/workflows/patch-v2-switching-current-net-unit.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v2-switching-current-net-unit
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply fix
        run: python .github/patch-v2-switching-current-net-unit.py
      - name: Static checks
        shell: bash
        run: |
          python scripts/check-v2-csp.py
          python - <<'PY'
          from pathlib import Path
          html=Path('net-cao-hon-co-that-tot-hon-v2.html').read_text()
          for x in ['function switchingCurrentNetStatus','data-current-net-help','Ví dụ: 22,000,000','Ô này nhập theo đồng. Ví dụ 22 triệu = 22,000,000đ.']:
              assert x in html, x
          a=html.index('<script>')+len('<script>'); b=html.index('</script>',a)
          Path('/tmp/v2-inline.js').write_text(html[a:b])
          print('PASS static current-net unit validation')
          PY
          node --check /tmp/v2-inline.js
      - name: Install DOM test dependency
        run: npm install --no-save jsdom@24
      - name: Behavioral test exact low-value case
        shell: bash
        run: |
          node <<'JS'
          const fs=require('fs');
          const {JSDOM}=require('jsdom');
          let html=fs.readFileSync('net-cao-hon-co-that-tot-hon-v2.html','utf8').replace(/<link[^>]+fonts\.googleapis\.com[^>]*>/g,'').replace(/<link[^>]+fonts\.gstatic\.com[^>]*>/g,'');
          const requests=[];
          const dom=new JSDOM(html,{runScripts:'dangerously',url:'https://example.test/',beforeParse(w){w.fetch=async(_url,opts)=>{requests.push(JSON.parse(opts.body));return{status:200,ok:true,json:async()=>({hasResults:false})}}}});
          const w=dom.window,d=w.document;
          const el=d.querySelector('input[data-sw="currentNet"]');
          const help=()=>d.querySelector('[data-current-net-help]');
          const input=v=>{el.value=v;el.dispatchEvent(new w.Event('input',{bubbles:true}))};
          if(!el||el.placeholder!=='Ví dụ: 22,000,000')throw new Error('current-net placeholder missing');
          input('22');
          if(!help().textContent.includes('Bạn đang nhập 22đ')||!help().textContent.includes('22,000,000đ'))throw new Error('22đ warning missing');
          input('22000000');
          if(help().style.display!=='none'||help().textContent!=='')throw new Error('valid 22m did not clear warning');
          input('0');
          if(!help().textContent.includes('phải lớn hơn 0')||el.getAttribute('aria-invalid')!=='true')throw new Error('zero validation missing');
          input('25000000');
          if(el.hasAttribute('aria-invalid')||help().style.display!=='none')throw new Error('valid current net did not reset field state');
          setTimeout(()=>{console.log('PASS behavioral current-net unit validation');w.close()},700);
          JS
      - name: Commit fix and remove bootstrap files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/patch-v2-switching-current-net-unit.py .github/workflows/patch-v2-switching-current-net-unit.yml
          git add net-cao-hon-co-that-tot-hon-v2.html
          git commit -m "Validate V2 switching current-net unit"
          git push origin HEAD:fix/v2-switching-current-net-unit
