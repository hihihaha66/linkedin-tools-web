name: MBA router v0.4
on:
  push:
    paths:
      - '.github/workflows/mba-router-v04.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Refactor MBA router
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('mba/index.html')
          s=p.read_text(encoding='utf-8')

          # Replace top-level model router: economics first, channel second.
          pattern=r'<section class="screen" id="modelRouter">.*?</section>\n\n<section class="screen" id="storeBasics">.*?</section>'
          replacement=r'''<section class="screen" id="modelRouter"><div class="head"><div class="eyebrow">Lập kế hoạch</div><h1>Bạn kiếm tiền chủ yếu từ đâu?</h1><p>Chọn thứ tạo ra doanh thu chính. MBA sẽ hỏi kênh bán ở bước sau nếu kênh đó làm thay đổi chi phí hoặc cách tính.</p></div><div class="form" style="max-width:860px;margin-bottom:12px"><div class="field" style="margin-bottom:0"><label>Tên business / dự án</label><input id="businessName" type="text" placeholder="Ví dụ: Tiệm Mây"><div class="helper">MBA sẽ dùng tên này ở kết quả, dashboard và các kịch bản của bạn.</div></div></div><div class="modelGrid"><button class="modelCard" onclick="chooseModel('foodChannel')"><div class="tag">01</div><h3>Bán đồ ăn / đồ uống</h3><p>Quán ăn, cà phê, đồ uống, bán mang đi hoặc giao qua ứng dụng.</p></button><button class="modelCard" onclick="chooseModel('goodsChannel')"><div class="tag">02</div><h3>Bán hàng hóa</h3><p>Shop, bán lẻ, TMĐT, dropshipping, print-on-demand hoặc bán sản phẩm qua nhiều kênh.</p></button><button class="modelCard" onclick="choosePendingModel('Bán dịch vụ')"><div class="tag">03</div><h3>Bán dịch vụ</h3><p>Salon, spa, sửa chữa, freelance, agency, tư vấn hoặc dịch vụ tính theo lượt, giờ hay dự án.</p></button><button class="modelCard" onclick="chooseModel('mmoType')"><div class="tag">04</div><h3>MMO / Kiếm tiền từ traffic & audience</h3><p>Affiliate, creator, quảng cáo website/app hoặc lead generation.</p></button><button class="modelCard" onclick="choosePendingModel('Sản phẩm số / Thu phí định kỳ')"><div class="tag">05</div><h3>Sản phẩm số / Thu phí định kỳ</h3><p>Khóa học, template, membership, phần mềm, SaaS hoặc nội dung trả phí.</p></button><button class="modelCard" onclick="choosePendingModel('Kết hợp nhiều nguồn thu')"><div class="tag">06</div><h3>Kết hợp nhiều nguồn thu</h3><p>Dùng khi business có nhiều nguồn thu khác nhau và bạn muốn tính riêng từng nguồn rồi ghép lại.</p></button><button class="modelCard" onclick="choosePendingModel('Mô hình khác')"><div class="tag">07</div><h3>Khác</h3><p>Dùng khi cách bạn kiếm tiền chưa nằm trong các nhóm trên.</p></button></div><div class="actions" style="max-width:860px;margin-left:auto;margin-right:auto"><button class="btn secondary" onclick="go('landing')">Quay lại</button></div></section>

<section class="screen" id="foodChannel"><div class="head"><div class="eyebrow">Bán đồ ăn / đồ uống</div><h1><span class="businessNameText">Business của tôi</span> bán qua những kênh nào?</h1><p>Chọn tất cả kênh đang hoặc dự định dùng. Kênh bán là thông tin bổ sung, không phải một business model riêng.</p></div><div class="form"><div class="field"><label>Kênh bán</label><div class="opts" id="foodChannels"><button class="opt" onclick="this.classList.toggle('a')">Tại quán</button><button class="opt" onclick="this.classList.toggle('a')">Mang đi</button><button class="opt" onclick="this.classList.toggle('a')">GrabFood</button><button class="opt" onclick="this.classList.toggle('a')">ShopeeFood</button><button class="opt" onclick="this.classList.toggle('a')">App giao đồ ăn khác</button><button class="opt" onclick="this.classList.toggle('a')">Khác</button></div></div><div class="mmoNote">Bản MVP hiện dùng một mức giá trị đơn và chi phí bình quân cho các kênh. Khi làm <strong>Kết hợp nhiều nguồn thu</strong>, MBA sẽ cho tách riêng tại quán, app giao đồ ăn và các nguồn khác.</div><div class="actions"><button class="btn secondary" onclick="go('modelRouter')">Quay lại</button><button class="btn" onclick="continueChannel('foodChannels','startup')">Tiếp tục</button></div></div></section>

<section class="screen" id="goodsChannel"><div class="head"><div class="eyebrow">Bán hàng hóa</div><h1><span class="businessNameText">Business của tôi</span> bán hàng qua những kênh nào?</h1><p>Chọn tất cả kênh đang hoặc dự định dùng. MBA sẽ dùng kênh để gợi ý đúng các loại phí cần tính.</p></div><div class="form"><div class="field"><label>Kênh bán</label><div class="opts" id="goodsChannels"><button class="opt" onclick="this.classList.toggle('a')">Cửa hàng</button><button class="opt" onclick="this.classList.toggle('a')">Shopee</button><button class="opt" onclick="this.classList.toggle('a')">TikTok Shop</button><button class="opt" onclick="this.classList.toggle('a')">Facebook / Instagram</button><button class="opt" onclick="this.classList.toggle('a')">Website</button><button class="opt" onclick="this.classList.toggle('a')">Khác</button></div></div><div class="mmoNote">Nếu bán nhiều kênh, bản MVP hiện dùng số bình quân chung. Chế độ chi tiết sau này sẽ tách phí và lợi nhuận theo từng kênh.</div><div class="actions"><button class="btn secondary" onclick="go('modelRouter')">Quay lại</button><button class="btn" onclick="continueChannel('goodsChannels','onlineUnit')">Tiếp tục</button></div></div></section>'''
          s,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f'router replacement failed: {n}')

          # F&B flow wording and back navigation.
          s=s.replace('<div class="eyebrow">Quán / cửa hàng</div><h1>Bạn cần bỏ ra bao nhiêu trước khi bắt đầu bán?</h1>','<div class="eyebrow">Bán đồ ăn / đồ uống</div><h1>Bạn cần bỏ ra bao nhiêu trước khi bắt đầu bán?</h1>',1)
          s=s.replace("onclick=\"go('storeBasics')\">Quay lại</button><button class=\"btn\" onclick=\"go('monthly')\">Tiếp tục","onclick=\"go('foodChannel')\">Quay lại</button><button class=\"btn\" onclick=\"go('monthly')\">Tiếp tục",1)
          s=s.replace('<div class="eyebrow">Quán / cửa hàng</div><h1>Mỗi tháng bạn vẫn phải trả những gì, dù bán nhiều hay ít?</h1>','<div class="eyebrow">Bán đồ ăn / đồ uống</div><h1>Mỗi tháng bạn vẫn phải trả những gì, dù bán nhiều hay ít?</h1>',1)
          s=s.replace('<div class="eyebrow">Quán / cửa hàng</div><h1>Mỗi đơn bán được, bạn còn lại bao nhiêu?</h1>','<div class="eyebrow">Bán đồ ăn / đồ uống</div><h1>Mỗi đơn bán được, bạn còn lại bao nhiêu?</h1>',1)
          s=s.replace('<div class="eyebrow">Quán / cửa hàng</div><h1>Bạn dự kiến bán được khoảng bao nhiêu?</h1>','<div class="eyebrow">Bán đồ ăn / đồ uống</div><h1>Bạn dự kiến bán được khoảng bao nhiêu?</h1>',1)

          # Retire old Online/TMĐT channel screen, because channel now sits under Bán hàng hóa.
          s,n=re.subn(r'<section class="screen" id="onlineChannel">.*?</section>\n','',s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('onlineChannel removal failed')

          # Re-label goods flow so business model and channel are no longer mixed.
          s=s.replace('Bán hàng online / TMĐT','Bán hàng hóa')
          s=s.replace("onclick=\"go('onlineChannel')\">Quay lại","onclick=\"go('goodsChannel')\">Quay lại",1)
          s=s.replace('Phí sàn + thanh toán (% trên doanh thu đơn thành công)','Phí kênh bán + thanh toán (% trên doanh thu đơn thành công)')
          s=s.replace('Nếu không bán qua sàn hoặc chưa rõ, có thể để trống.','Nếu kênh bán không có khoản phí này hoặc bạn chưa rõ, có thể để trống.')
          s=s.replace('phí sàn/thanh toán','phí kênh bán/thanh toán')
          s=s.replace('tỷ lệ phí giữ nguyên','tỷ lệ phí theo kênh giữ nguyên')

          # MMO helper now points product sellers to Bán hàng hóa.
          s=s.replace('Nếu bạn trực tiếp bán sản phẩm cho khách qua Shopee, TikTok Shop hoặc website, hãy chọn <strong>Bán hàng hóa</strong> thay vì MMO.','Nếu bạn trực tiếp bán sản phẩm cho khách qua Shopee, TikTok Shop hoặc website, hãy chọn <strong>Bán hàng hóa</strong> thay vì MMO.')
          s=s.replace('Nếu bạn trực tiếp bán sản phẩm cho khách qua Shopee, TikTok Shop hoặc website, hãy chọn <strong>Bán hàng online / TMĐT</strong> thay vì MMO.','Nếu bạn trực tiếp bán sản phẩm cho khách qua Shopee, TikTok Shop hoặc website, hãy chọn <strong>Bán hàng hóa</strong> thay vì MMO.')

          # Add router helpers.
          old="function chooseModel(id){const input=$('#businessName');const name=(input?.value||currentBusinessName).trim();if(!name){toast('Nhập tên business / dự án để MBA cá nhân hóa kết quả cho bạn.');if(input)input.focus();return}currentBusinessName=name;localStorage.setItem('mba_business_name_v03',name);updateBusinessNameUI();go(id)}"
          new=old+"function choosePendingModel(label){const input=$('#businessName');const name=(input?.value||currentBusinessName).trim();if(!name){toast('Nhập tên business / dự án để MBA cá nhân hóa kết quả cho bạn.');if(input)input.focus();return}currentBusinessName=name;localStorage.setItem('mba_business_name_v03',name);updateBusinessNameUI();toast('Flow '+label+' đang được hoàn thiện.')}function continueChannel(groupId,nextId){const selected=$$('#'+groupId+' .opt.a');if(!selected.length){toast('Chọn ít nhất một kênh để tiếp tục.');return}localStorage.setItem('mba_'+groupId,JSON.stringify(selected.map(x=>x.textContent.trim())));go(nextId)}"
          if old not in s:
              raise SystemExit('chooseModel helper not found')
          s=s.replace(old,new,1)

          # Old type selector no longer exists after router refactor.
          s=s.replace("if($('#types'))$('#types').onclick=e=>{if(!e.target.classList.contains('opt'))return;$$('#types .opt').forEach(x=>x.classList.remove('a'));e.target.classList.add('a')};",'')

          p.write_text(s,encoding='utf-8')
          PY
          rm .github/workflows/mba-router-v04.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add mba/index.html .github/workflows/mba-router-v04.yml
          git commit -m "Refactor MBA router around business economics"
          git push
