name: Patch V2 free security web follow-up

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/patch-v2-free-security-web-followup.py'
      - '.github/workflows/patch-v2-free-security-web-followup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v2-free-security-hardening
      - name: Apply follow-up
        run: python .github/patch-v2-free-security-web-followup.py
      - name: Validate CSP and wording
        run: |
          python scripts/check-v2-csp.py
          grep -F '>Theo mặc định</button>' net-cao-hon-co-that-tot-hon-v2.html
          grep -F '>Tự nhập</button>' net-cao-hon-co-that-tot-hon-v2.html
          grep -F 'Căn cứ BH dùng theo lựa chọn' net-cao-hon-co-that-tot-hon-v2.html
      - name: Commit follow-up and remove bootstrap files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/patch-v2-free-security-web-followup.py .github/workflows/patch-v2-free-security-web-followup.yml
          git add net-cao-hon-co-that-tot-hon-v2.html
          git commit -m "Finish V2 frontend security cleanup"
          git push origin HEAD:release/v2-free-security-hardening
