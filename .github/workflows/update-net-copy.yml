name: Update net tool copy

on:
  push:
    paths:
      - '.github/workflows/update-net-copy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('net-cao-hon-co-that-tot-hon.html')
          s=p.read_text(encoding='utf-8')
          old1='So 2 offer không chỉ bằng tiền về tay. Một offer trả net cao hơn có thể vì công ty khai đóng bảo hiểm trên mức thấp hơn lương thật - phần an sinh khi thất nghiệp, ốm đau, thai sản vì thế cũng thấp đi. Hoặc vì nó lặng lẽ lấy nhiều giờ của bạn hơn: di chuyển xa hơn, hết hybrid, OT, những tháng thử việc. Tool quy hai bên về cùng đơn vị - tiền, giờ, quyền lợi - để bạn thấy mình đang đổi gì lấy gì, rồi tự quyết.'
          new1='So offer không chỉ là so tiền về tay. Net cao hơn đôi khi đến từ việc công ty đóng bảo hiểm trên mức thấp hơn lương thực nhận, hoặc đổi lại bằng nhiều thời gian hơn cho việc đi lại, OT, ít ngày hybrid hay thời gian thử việc dài hơn. Tool này đặt các yếu tố đó cạnh nhau để bạn nhìn rõ mỗi offer đang được gì, mất gì, rồi mới ra quyết định.'
          old2='Offer ghi gross hay net đều được - chọn đúng loại ở từng bên, nếu là net tool tự quy ngược ra gross để tính thuế và bảo hiểm. Mức khai bảo hiểm là con số công ty đăng ký đóng BHXH/BHYT/BHTN - hỏi thẳng khi phỏng vấn, hoặc tra VssID sau khi vào.'
          new2='Gross hay net đều được - chọn đúng loại ở mỗi offer. Nếu nhập net, tool sẽ tự quy đổi để tính thuế và bảo hiểm. Mức đóng BHXH/BHYT/BHTN nên hỏi công ty khi phỏng vấn hoặc kiểm tra trên VssID sau khi bạn vào làm.'
          if old1 not in s:
              raise SystemExit('old1 not found')
          if old2 not in s:
              raise SystemExit('old2 not found')
          s=s.replace(old1,new1).replace(old2,new2)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/update-net-copy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add net-cao-hon-co-that-tot-hon.html .github/workflows/update-net-copy.yml
          git commit -m "Refine net offer tool copy"
          git push origin main
