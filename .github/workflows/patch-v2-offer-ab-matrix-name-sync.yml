name: Sync V2 offer matrix names

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/patch-v2-offer-ab-matrix-name-sync.py'
      - '.github/workflows/patch-v2-offer-ab-matrix-name-sync.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v2-offer-ab-matrix
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply offer-name sync
        run: python .github/patch-v2-offer-ab-matrix-name-sync.py
      - name: Validate CSP and syntax
        shell: bash
        run: |
          python scripts/check-v2-csp.py
          python - <<'PY'
          from pathlib import Path
          html=Path('net-cao-hon-co-that-tot-hon-v2.html').read_text()
          assert 'data-offer-head="0"' in html and 'data-offer-head="1"' in html
          assert 'querySelectorAll' in html and 'data-offer-head' in html
          a=html.index('<script>')+len('<script>'); b=html.index('</script>',a)
          Path('/tmp/v2-inline.js').write_text(html[a:b])
          print('PASS: duplicated read-only offer headers stay synchronized')
          PY
          node --check /tmp/v2-inline.js
      - name: Commit sync and remove bootstrap files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/patch-v2-offer-ab-matrix-name-sync.py .github/workflows/patch-v2-offer-ab-matrix-name-sync.yml
          git add net-cao-hon-co-that-tot-hon-v2.html
          git commit -m "Keep V2 offer matrix names synchronized"
          git push origin HEAD:refactor/v2-offer-ab-matrix
