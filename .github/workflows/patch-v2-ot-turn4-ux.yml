name: Update V2 Turn 4 OT UX

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/patch-v2-ot-turn4-ux.py'
      - '.github/workflows/patch-v2-ot-turn4-ux.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v2-ot-turn4-ux
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply OT frontend
        run: python .github/patch-v2-ot-turn4-ux.py
      - name: Validate CSP and inline JS
        shell: bash
        run: |
          python scripts/check-v2-csp.py
          python - <<'PY'
          from pathlib import Path
          html=Path('net-cao-hon-co-that-tot-hon-v2.html').read_text()
          for x in ['OT chủ yếu rơi vào','OT ngày lễ/Tết','Mức lương dùng để tính OT','Ước tính theo lương offer','Vượt mốc 40 giờ/tháng','vượt 200 giờ/năm','vượt 300 giờ/năm','o.otMonthly=Number.isFinite(n)&&n>=0?n:0']:
              assert x in html, x
          assert 'delete o.otMonthly' not in html
          a=html.index('<script>')+len('<script>');b=html.index('</script>',a)
          Path('/tmp/v2-inline.js').write_text(html[a:b])
          print('PASS static Turn 4 OT UX')
          PY
          node --check /tmp/v2-inline.js
      - name: Commit update and remove bootstrap files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/patch-v2-ot-turn4-ux.py .github/workflows/patch-v2-ot-turn4-ux.yml
          git add net-cao-hon-co-that-tot-hon-v2.html
          git commit -m "Implement V2 Turn 4 OT UX"
          git push origin HEAD:refactor/v2-ot-turn4-ux
