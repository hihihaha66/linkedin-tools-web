name: Patch V2 Turn 6 frontend

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/patch-v2-turn6-frontend.py'
      - '.github/workflows/patch-v2-turn6-frontend.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v2-turn6-final
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply Turn 6 frontend validation fix
        run: python .github/patch-v2-turn6-frontend.py
      - name: Check CSP and syntax
        shell: bash
        run: |
          python scripts/check-v2-csp.py
          python - <<'PY'
          from pathlib import Path
          html=Path('net-cao-hon-co-that-tot-hon-v2.html').read_text()
          start=html.index('<script>')+len('<script>')
          end=html.index('</script>',start)
          Path('/tmp/v2-inline.js').write_text(html[start:end])
          PY
          node --check /tmp/v2-inline.js
      - name: Install DOM test dependency
        run: npm install --no-save jsdom@24
      - name: Run existing OT smoke
        run: node tests/ot-turn4-smoke.js
      - name: Run final Turn 6 smoke
        run: node tests/v2-turn6-final-smoke.js
      - name: Commit implementation and remove bootstrap files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/patch-v2-turn6-frontend.py .github/workflows/patch-v2-turn6-frontend.yml
          git add -- net-cao-hon-co-that-tot-hon-v2.html tests/v2-turn6-final-smoke.js .github/workflows/v2-security-check.yml
          git commit -m "Complete V2 Turn 6 frontend QA"
          git push origin HEAD:qa/v2-turn6-final
