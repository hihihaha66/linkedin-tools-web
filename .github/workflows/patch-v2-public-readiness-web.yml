name: Patch V2 public readiness web

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/patch-v2-public-readiness-web.py'
      - '.github/workflows/patch-v2-public-readiness-web.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v2-public-readiness
      - name: Apply frontend release patch
        run: python .github/patch-v2-public-readiness-web.py
      - name: Validate release wording and links
        shell: bash
        run: |
          grep -F 'net-cao-hon-co-that-tot-hon-v2.html' index.html
          grep -F 'Gói 12 tháng chuẩn hóa' net-cao-hon-co-that-tot-hon-v2.html
          grep -F 'Chưa rõ' net-cao-hon-co-that-tot-hon-v2.html
          grep -F 'net-cao-hon-v2-du-lieu.json' net-cao-hon-co-that-tot-hon-v2.html
          grep -F '01/07/2026' net-cao-hon-co-that-tot-hon-v2.html
      - name: Commit release patch and remove bootstrap files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/patch-v2-public-readiness-web.py .github/workflows/patch-v2-public-readiness-web.yml
          git add index.html net-cao-hon-co-that-tot-hon-v2.html
          git commit -m "Prepare V2 frontend for public release"
          git push origin HEAD:release/v2-public-readiness
