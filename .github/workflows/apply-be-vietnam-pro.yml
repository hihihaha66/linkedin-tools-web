name: Apply typography

on:
  push:
    paths:
      - '.github/workflows/apply-be-vietnam-pro.yml'

permissions:
  contents: write

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update typography and dash style
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path('index.html'),
              Path('tra-thap-co-that-la-re.html'),
              Path('net-cao-hon-co-that-tot-hon.html'),
          ]

          font_links = '''  <link rel="preconnect" href="https://fonts.googleapis.com">\n  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">\n\n'''

          for path in files:
              s = path.read_text(encoding='utf-8')

              # Remove older Google-font declarations if present.
              s = re.sub(r'\s*<link rel="preconnect" href="https://fonts\.googleapis\.com">\s*', '\n', s)
              s = re.sub(r'\s*<link rel="preconnect" href="https://fonts\.gstatic\.com" crossorigin>\s*', '\n', s)
              s = re.sub(r'\s*<link href="https://fonts\.googleapis\.com/css2\?[^\"]+" rel="stylesheet">\s*', '\n', s)

              if 'family=Be+Vietnam+Pro' not in s:
                  s = s.replace('<style>', font_links + '<style>', 1)

              s = re.sub(r'--serif\s*:[^;]+;', "--serif:'Be Vietnam Pro','Segoe UI',Arial,sans-serif;", s)
              s = re.sub(r'--sans\s*:[^;]+;', "--sans:'Be Vietnam Pro','Segoe UI',Arial,sans-serif;", s)
              if '--mono' in s:
                  s = re.sub(r'--mono\s*:[^;]+;', "--mono:'IBM Plex Mono',Consolas,'Courier New',monospace;", s)
              else:
                  s = s.replace('--sans:\'Be Vietnam Pro\',\'Segoe UI\',Arial,sans-serif;', "--sans:'Be Vietnam Pro','Segoe UI',Arial,sans-serif;\n      --mono:'IBM Plex Mono',Consolas,'Courier New',monospace;", 1)

              # User preference: long em dash -> short hyphen.
              s = s.replace('—', '-')

              path.write_text(s, encoding='utf-8')
          PY

          rm .github/workflows/apply-be-vietnam-pro.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tra-thap-co-that-la-re.html net-cao-hon-co-that-tot-hon.html .github/workflows/apply-be-vietnam-pro.yml
          git commit -m "Apply Be Vietnam Pro typography" || exit 0
          git push
