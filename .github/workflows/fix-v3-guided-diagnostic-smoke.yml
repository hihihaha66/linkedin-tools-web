name: Fix V3 guided diagnostic smoke

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/fix-v3-guided-diagnostic-smoke.py'
      - '.github/workflows/fix-v3-guided-diagnostic-smoke.yml'

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v3-guided-diagnostics
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply smoke stabilization
        run: python .github/fix-v3-guided-diagnostic-smoke.py
      - name: Verify V2 untouched and V3 syntax/CSP
        shell: bash
        run: |
          git diff --exit-code HEAD -- net-cao-hon-co-that-tot-hon-v2.html
          python - <<'PY'
          from pathlib import Path
          import re,hashlib,base64
          html=Path('net-cao-hon-co-that-tot-hon-v3.html').read_text();start=html.index('<script>')+len('<script>');end=html.index('</script>',start);js=html[start:end]
          Path('/tmp/v3-inline.js').write_text(js)
          m=re.search(r"script-src 'sha256-([^']+)'",html);assert m
          assert m.group(1)==base64.b64encode(hashlib.sha256(js.encode()).digest()).decode()
          PY
          node --check /tmp/v3-inline.js
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: python3 -m http.server 8000 >/tmp/v3-http.log 2>&1 &
      - name: Run V3 responsive and diagnostic smoke
        run: node tests/v3-current-offers-responsive.mjs
      - name: Commit fix and remove bootstrap files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/fix-v3-guided-diagnostic-smoke.py .github/workflows/fix-v3-guided-diagnostic-smoke.yml
          git add -- tests/v3-current-offers-responsive.mjs
          git commit -m "Stabilize V3 diagnostic browser smoke"
          git push origin HEAD:feature/v3-guided-diagnostics
