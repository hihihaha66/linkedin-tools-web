name: Fix V3 page title

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/patch-v3-page-title.py'
      - '.github/workflows/patch-v3-page-title.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v3-page-title
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply V3 title patch
        run: python .github/patch-v3-page-title.py
      - name: Verify V2 untouched
        run: git diff --exit-code HEAD -- net-cao-hon-co-that-tot-hon-v2.html
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: python3 -m http.server 8000 >/tmp/v3-http.log 2>&1 &
      - name: Run V3 responsive suite
        run: node tests/v3-current-offers-responsive.mjs
      - name: Commit implementation and remove bootstrap files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/patch-v3-page-title.py .github/workflows/patch-v3-page-title.yml
          git add -- net-cao-hon-co-that-tot-hon-v3.html tests/v3-current-offers-responsive.mjs
          git commit -m "Fix V3 page title"
          git push origin HEAD:fix/v3-page-title
