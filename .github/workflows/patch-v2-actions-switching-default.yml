name: Patch V2 actions and switching defaults

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/patch-v2-actions-switching-default.py'
      - '.github/workflows/patch-v2-actions-switching-default.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/v2-actions-switching-default
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply UX patch
        run: python .github/patch-v2-actions-switching-default.py
      - name: Validate CSP, syntax and hierarchy
        shell: bash
        run: |
          python scripts/check-v2-csp.py
          python - <<'PY'
          from pathlib import Path
          html=Path('net-cao-hon-co-that-tot-hon-v2.html').read_text()
          a=html.index('<script>')+len('<script>'); b=html.index('</script>',a)
          Path('/tmp/v2-inline.js').write_text(html[a:b])
          assert '<button class="btn ghost tiny" id="importBtn">↑ Nhập dữ liệu (.json)</button>' in html
          assert html.index('id="importBtn"') < html.index('Bối cảnh chung')
          assert html.index('id="saveBtn"') > html.index('id="verdict"')
          assert html.index('data-v="on" class="on">Tính thêm</button>') < html.index('data-v="off">Bỏ qua</button>')
          assert 'currentBonusRule:"lost"' in html
          assert html.index('<option value="lost"') < html.index('<option value="unknown"')
          print('PASS: actions moved; switching and lost-bonus defaults are visible')
          PY
          node --check /tmp/v2-inline.js
      - name: Commit UX patch and remove bootstrap files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/patch-v2-actions-switching-default.py .github/workflows/patch-v2-actions-switching-default.yml
          git add net-cao-hon-co-that-tot-hon-v2.html
          git commit -m "Refine V2 actions and switching defaults"
          git push origin HEAD:ux/v2-actions-switching-default
