name: One-time Vietnamese font fix

on:
  push:
    paths:
      - '.github/workflows/fix-vietnamese-fonts.yml'

permissions:
  contents: write

jobs:
  fix-fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace custom serif fonts with system fonts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path('index.html'),
              Path('tra-thap-co-that-la-re.html'),
              Path('net-cao-hon-co-that-tot-hon.html'),
          ]

          for p in files:
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'\n?\s*<link rel="preconnect" href="https://fonts\.googleapis\.com">', '', s)
              s = re.sub(r'\n?\s*<link rel="preconnect" href="https://fonts\.gstatic\.com" crossorigin>', '', s)
              s = re.sub(r'\n?\s*<link href="https://fonts\.googleapis\.com/css2\?[^\n]+rel="stylesheet">', '', s)
              s = re.sub(r'\s*@font-face\s*\{[^}]*Newsreader[^}]*\}\s*', '\n', s)
              s = re.sub(r'--serif\s*:[^;]+;', '--serif:"Segoe UI", Arial, sans-serif;', s)
              s = re.sub(r'--sans\s*:[^;]+;', '--sans:"Segoe UI", Arial, sans-serif;', s)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit font fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-vietnamese-fonts.yml
          git add -A
          git commit -m "Use system fonts for reliable Vietnamese rendering"
          git push
