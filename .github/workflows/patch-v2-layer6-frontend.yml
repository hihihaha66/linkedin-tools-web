name: Patch V2 Layer 6 frontend

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/patch-v2-layer6-frontend.py'
      - '.github/workflows/patch-v2-layer6-frontend.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v2-layer6-inverse-solver
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply Layer 6 frontend patch
        run: python .github/patch-v2-layer6-frontend.py
      - name: Check CSP and inline JavaScript syntax
        shell: bash
        run: |
          python scripts/check-v2-csp.py
          python - <<'PY'
          from pathlib import Path
          html=Path('net-cao-hon-co-that-tot-hon-v2.html').read_text()
          start=html.index('<script>')+len('<script>')
          end=html.index('</script>',start)
          Path('/tmp/v2-inline.js').write_text(html[start:end])
          PY
          node --check /tmp/v2-inline.js
      - name: Install UI test dependencies
        run: |
          npm install --no-save jsdom@24 playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run behavioral smoke tests
        run: |
          node tests/ot-turn4-smoke.js
          node tests/v2-turn6-final-smoke.js
      - name: Start static server
        run: python3 -m http.server 8000 >/tmp/v2-http.log 2>&1 &
      - name: Run multi-width responsive smoke
        run: node tests/v2-turn6-responsive.mjs
      - name: Commit implementation and remove bootstrap files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/patch-v2-layer6-frontend.py .github/workflows/patch-v2-layer6-frontend.yml
          git add -- net-cao-hon-co-that-tot-hon-v2.html tests/v2-turn6-final-smoke.js tests/v2-turn6-responsive.mjs
          git commit -m "Implement V2 Layer 6 frontend"
          git push origin HEAD:feature/v2-layer6-inverse-solver
